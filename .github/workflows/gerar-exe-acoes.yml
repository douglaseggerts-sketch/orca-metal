name: Gerar EXE Ações (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'pc/**'
      - 'acoes/app/src/main/assets/**'
      - '.github/workflows/gerar-exe-acoes.yml'

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copiar a tela (a mesma do app Android)
        run: mkdir -p ui && cp ../acoes/app/src/main/assets/index.html ui/index.html

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar instalador
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorAcoes-Windows
          path: pc/dist/MonitorAcoes-Instalador.exe
