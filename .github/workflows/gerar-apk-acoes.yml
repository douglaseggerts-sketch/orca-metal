name: Gerar APK Ações

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'acoes/**'
      - '.github/workflows/gerar-apk-acoes.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acoes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk MonitorAcoes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorAcoes-apk
          path: acoes/MonitorAcoes.apk
