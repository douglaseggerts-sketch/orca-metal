<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Monitor de Ações</title>
<style>
  :root {
    --bg: #08090C; --card: #111318; --card2: #191C23; --linha: #252A33;
    --txt: #E8EBF0; --sub: #8A93A3; --alta: #19C37D; --baixa: #F23645;
    --ouro: #2F7BFF; --azul: #4FC3F7;
    --grade: #222933; --eixo: #6E7887; --cruz: #8B95A5; --swOn: #12284D;
    --compraBg: #0F3D2A; --vendaBg: #3D1418; --avisoBg: #2A1418; --avisoBorda: #5A2530; --avisoTxt: #F5B8C0;
    color-scheme: dark;
  }
  :root[data-tema="claro"] {
    --bg: #F3F4F6; --card: #FFFFFF; --card2: #EEF0F3; --linha: #DADDE3;
    --txt: #15181E; --sub: #5F6878; --alta: #0A9A57; --baixa: #D9283A;
    --ouro: #2563EB; --azul: #0288D1;
    --grade: #E5E7EB; --eixo: #7A8494; --cruz: #9AA3B2; --swOn: #DCE7FF;
    --compraBg: #DDF5E9; --vendaBg: #FBE3E6; --avisoBg: #FDECEE; --avisoBorda: #F3B9C1; --avisoTxt: #8A1C2B;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 72px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--linha); }
  header h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 650; letter-spacing: .2px; }
  .icone { background: var(--card); border: 1px solid var(--linha); color: var(--txt); border-radius: 10px;
    width: 38px; height: 38px; font-size: 18px; display: grid; place-items: center; }
  main { padding: 12px 16px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav button { flex: 1; background: none; border: 0; color: var(--sub); padding: 10px 0 12px; font-size: 12px; }
  nav button b { display: block; font-size: 20px; line-height: 1.2; font-weight: 400; }
  nav button.on { color: var(--ouro); }
  .modo { display:flex; gap:6px; } .modo button { background: var(--card2); border:1px solid var(--linha); color: var(--sub); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:600; } .modo button.on { color: var(--txt); border-color: var(--ouro); }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .linha { display: flex; gap: 8px; align-items: center; }
  input, select { background: var(--card2); color: var(--txt); border: 1px solid var(--linha); border-radius: 10px;
    padding: 10px 12px; font-size: 15px; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--ouro); outline-offset: -1px; }
  .btn { background: var(--ouro); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px;
    font-weight: 650; font-size: 15px; white-space: nowrap; }
  .btn.sec { background: var(--card2); color: var(--txt); border: 1px solid var(--linha); }
  .btn.peq { padding: 6px 10px; font-size: 13px; }
  .sub { color: var(--sub); font-size: 13px; }
  .alta { color: var(--alta); } .baixa { color: var(--baixa); }
  .vazio { text-align: center; color: var(--sub); padding: 30px 10px; }
  /* lista */
  .ativo { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card);
    border: 1px solid var(--linha); border-radius: 14px; margin-bottom: 8px; }
  .ativo .nome { flex: 1; min-width: 0; }
  .ativo .tk { font-weight: 700; font-size: 16px; }
  .ativo .ds { color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ativo .pr { text-align: right; font-variant-numeric: tabular-nums; }
  .ativo .pr div:first-child { font-weight: 650; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--card2); color: var(--sub);
    border: 1px solid var(--linha); margin-left: 6px; vertical-align: 2px; font-weight: 600; }
  .x { background: none; border: 0; color: var(--sub); font-size: 20px; padding: 0 2px 0 6px; }
  /* detalhe */
  .topo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .topo .grande { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .periodos { display: flex; gap: 6px; margin: 12px 0 8px; }
  .periodos button { flex: 1; background: var(--card2); border: 1px solid var(--linha); color: var(--sub);
    border-radius: 8px; padding: 7px 0; font-size: 13px; font-weight: 600; }
  .periodos button.on { color: #fff; background: var(--ouro); border-color: var(--ouro); }
  .grafico.comIFR { height: 440px; }
  .grafico { position: relative; height: 340px; margin: 0 -6px; touch-action: pan-y; }
  .grafico canvas { width: 100%; height: 100%; display: block; }
  .info { min-height: 20px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; margin: 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha); border-radius: 20px;
    padding: 4px 10px; font-size: 13px; background: var(--card2); color: var(--sub); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chip.on { color: var(--txt); border-color: var(--cruz); }
  .chip.off i { opacity: .25; }
  .sinal { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--card2); margin-top: 10px; }
  h2 { font-size: 15px; margin: 4px 0 10px; font-weight: 650; }
  .form { display: grid; gap: 8px; }
  .al { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--linha); }
  .al:first-of-type { border-top: 0; }
  .al .t { flex: 1; min-width: 0; font-size: 14px; }
  .bola { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .sw { position: relative; width: 42px; height: 24px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; background: var(--card2); border: 1px solid var(--linha); border-radius: 20px; transition: .15s; }
  .sw span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: var(--sub); transition: .15s; }
  .sw input:checked + span { background: var(--swOn); border-color: var(--ouro); }
  .sw input:checked + span::after { left: 20px; background: #fff; }
  .aviso { background: var(--avisoBg); border: 1px solid var(--avisoBorda); color: var(--avisoTxt); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 84px; background: #2A313C; color: #E8EBF0;
    padding: 12px 14px; border-radius: 12px; font-size: 14px; z-index: 9; opacity: 0; transform: translateY(10px);
    transition: .2s; pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }
  .carregando { color: var(--sub); text-align: center; padding: 40px 0; }
  @media (min-width: 760px) {
    main, header { max-width: 980px; margin: 0 auto; }
    header { border-bottom: 0; }
    .grafico { height: 480px; } .grafico.comIFR { height: 620px; }
    nav { justify-content: center; } nav button { flex: 0 0 150px; }
  }
  #folha { display: none; position: fixed; inset: 0; z-index: 20; }
  #folha .fundo { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
  #folha .painel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; background: var(--card);
    border-top: 1px solid var(--linha); border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 760px) { #folha .painel { left: 50%; right: auto; width: 520px; transform: translateX(-50%); bottom: auto; top: 10vh; border-radius: 16px; border: 1px solid var(--linha); } }
  .abas { display: flex; gap: 4px; overflow-x: auto; margin: -4px -16px 10px; padding: 0 16px; scrollbar-width: none; }
  .abas::-webkit-scrollbar { display: none; }
  .abas button { flex: none; background: none; border: 0; color: var(--sub); font-size: 15px; font-weight: 650; padding: 9px 14px; border-radius: 10px; }
  .abas button.on { background: var(--card2); color: var(--txt); }
  .abas .mais { margin-left: auto; font-size: 20px; padding: 4px 12px; }
  .barra-lista { display: flex; gap: 8px; margin-bottom: 8px; }
  .barra-lista select { width: auto; flex: 1; padding: 8px 6px; font-size: 13.5px; min-width: 0; }
  .barra-lista > .btn { flex: none; padding: 6px 10px; }
  .barra-lista .ordem { display: flex; flex: 1.35; border: 1px solid var(--ouro); border-radius: 10px; overflow: hidden; }
  .barra-lista .ordem button { background: var(--card2); border: 0; color: var(--ouro); font-size: 16px; padding: 0 10px; }
  .barra-lista .ordem select { border: 0; border-radius: 0; }
  .cotacoes { margin: 0 -16px; }
  .cot { display: grid; grid-template-columns: 1.25fr 1fr 1fr; align-items: center; padding: 9px 16px 9px 12px; border-left: 4px solid transparent;
    border-bottom: 1px solid var(--linha); cursor: pointer; user-select: none; -webkit-user-select: none; }
  .cot:active { background: var(--card2); }
  .cot > div { display: flex; flex-direction: column; min-width: 0; font-variant-numeric: tabular-nums; }
  .cot .c1 { align-items: flex-start; } .cot .c2 { align-items: center; } .cot .c3 { align-items: flex-end; }
  .cot b { font-size: 17px; }
  .cot .tk2 { font-weight: 800; font-size: 17px; padding: 2px 8px; margin-left: -8px; border-radius: 6px; letter-spacing: .3px; }
  .cot .nm { color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: 2px; }
  .cot .c4 { grid-column: 1 / -1; flex-direction: row; align-items: center; font-size: 11.5px; color: var(--sub); margin-top: 4px; }
  .grade-ind { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .ind { background: var(--card2); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ind .sub { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ind b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .ind.clic { cursor: pointer; border-color: var(--cruz); }
  /* PC com janela larga: cotações à esquerda, gráfico à direita */
  #telaEsq { display: none; }
  body.dividida { padding-bottom: 0; }
  body.dividida header { max-width: none; }
  /* cabeçalho baixo no PC dividido: mais espaço para o gráfico */
  body.dividida header { padding: 5px 16px 5px; }
  body.dividida header h1 { font-size: 15px; }
  body.dividida header .icone { width: 30px; height: 30px; font-size: 15px; border-radius: 8px; }
  body.dividida #split { display: grid; grid-template-columns: minmax(290px, 23%) 1fr; height: calc(100vh - 41px - 66px); }
  body.dividida #telaEsq { display: block; overflow-y: auto; border-right: 1px solid var(--linha); padding: 8px 10px 16px; }
  /* lista compacta no PC */
  body.dividida .abas { margin: 0 -10px 6px; padding: 0 10px; gap: 2px; }
  body.dividida .abas button { font-size: 12px; padding: 5px 8px; border-radius: 7px; }
  body.dividida .abas .mais { font-size: 16px; padding: 2px 8px; }
  body.dividida .barra-lista { gap: 5px; margin-bottom: 4px; }
  body.dividida .barra-lista > .btn { padding: 4px 8px; font-size: 12px; }
  body.dividida .barra-lista select { padding: 5px 4px; font-size: 12px; }
  body.dividida .barra-lista .ordem button { padding: 0 6px; font-size: 13px; }
  body.dividida .cotacoes { margin: 0 -10px; }
  body.dividida .cot { padding: 5px 10px 5px 7px; border-left-width: 3px; grid-template-columns: 1.2fr 1fr 0.95fr; }
  body.dividida .cot b { font-size: 13.5px; }
  body.dividida .cot .tk2 { font-size: 13.5px; padding: 1px 6px; margin-left: -6px; }
  body.dividida .cot .nm { font-size: 10.5px; margin-top: 0; }
  body.dividida #telaEsq > .sub { font-size: 10.5px !important; }
  body.dividida main { max-width: none; margin: 0; overflow-y: auto; padding: 4px 24px 24px; }
  body.dividida main .topo .grande { font-size: 24px; }
  body.dividida main .periodos { margin: 6px 0 4px; }
  body.dividida main .periodos button { padding: 4px 0; font-size: 12px; }
  body.dividida .grafico { height: 500px; } body.dividida .grafico.comIFR { height: 640px; }
  body.dividida .cot.sel { background: var(--card2); }
  body.dividida .cot.sel .tk2:not(.pos) { text-decoration: underline; text-underline-offset: 4px; }
  .painel-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  .painel-grid .card { margin: 0; min-width: 0; }
  .tit-p { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .6px; color: #14B8A6; }
  .icone.peq { width: 30px; height: 30px; font-size: 15px; border-radius: 8px; }
  @media (min-width: 900px) { .painel-grid { grid-template-columns: repeat(3, 1fr); } .painel-grid .pc-rent { grid-column: span 2; } body.v-painel main { max-width: 1280px; } }
  .tab-wrap { overflow-x: auto; margin: 8px -4px 0; }
  .tab-cart { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tab-cart th { font-size: 10.5px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .4px; text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--linha); }
  .tab-cart td { text-align: right; padding: 6px; border-bottom: 1px solid var(--linha); }
  .tab-cart th:first-child, .tab-cart td:first-child { text-align: left; }
  .tab-cart td.tk { font-weight: 700; }
  .tab-cart tbody tr { cursor: pointer; } .tab-cart tbody tr:hover { background: var(--card2); }
  .tab-cart tfoot td { font-weight: 700; border-bottom: 0; }
  .tab-cart .alvo-ok { color: var(--alta); font-weight: 700; }
  :root { --provRec: #0A1F66; --provFut: #8FB0FF; --provAtual: #2563EB; }
  :root:not([data-tema="claro"]) { --provRec: #3D6BFF; --provFut: #5470B8; --provAtual: #8FB0FF; }
  .prov-graf { display: flex; align-items: flex-end; gap: 6px; height: 190px; margin: 10px 0 2px; overflow-x: auto; padding-top: 4px; }
  .pcol { flex: 1 0 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 34px; }
  @media (max-width: 699px) { .pcol { flex: 0 0 38px; } .pval { font-size: 9.5px; } }
  .pval { font-size: 10px; color: var(--sub); white-space: nowrap; margin-bottom: 3px; }
  .pbar { width: 78%; max-width: 64px; display: flex; flex-direction: column; border-radius: 3px 3px 0 0; overflow: hidden; max-height: calc(100% - 46px); }
  .prec { background: var(--provRec); } .prec.patual { background: var(--provAtual); } .pfut { background: var(--provFut); }
  .prot { font-size: 10px; color: var(--sub); text-align: center; line-height: 1.2; margin-top: 4px; border-top: 1px solid var(--linha); width: 100%; padding-top: 3px; }
  .dist-grid { display: block; }
  @media (min-width: 1000px) { .dist-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 32px; align-items: center; } }
  /* PC: todas as telas usam a largura toda da janela */
  @media (min-width: 1000px) {
    main, header, body.v-painel main { max-width: none; margin: 0; }
    main { padding: 12px 24px; } header { padding-left: 24px; padding-right: 24px; }
  }
  #confirma { display: none; position: fixed; inset: 0; z-index: 40; }
  #confirma .fundo { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  #confirma .caixa { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px));
    background: var(--card); border: 1px solid var(--linha); border-radius: 14px; padding: 18px; }
  input[type=color] { padding: 2px; height: 42px; width: 52px; flex: none; }
</style>
</head>
<body>
<header>
  <button class="icone" id="btVoltar" style="display:none" onclick="voltar()">‹</button>
  <h1 id="titulo">Ações</h1>
  <button class="icone" id="btAtualizar" onclick="atualizar()">↻</button>
</header>
<div id="split"><aside id="telaEsq"></aside><main id="tela"></main></div>
<nav>
  <button data-v="lista" onclick="ir('lista')"><b>📈</b>Cotações</button>
  <button data-v="painel" onclick="ir('painel')"><b>📊</b>Painel</button>
  <button data-v="carteira" onclick="ir('carteira')"><b>💼</b>Carteira</button>
  <button data-v="alertas" onclick="ir('alertas')"><b>🔔</b>Alertas</button>
  <button data-v="medias" onclick="ir('medias')"><b>〰️</b>Indicadores</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ===================== Ponte com o Android (ou simulação no navegador) ===================== */
const B = window.Android || simulacao();
const PC = !!(B.plataforma && B.plataforma() === 'pc');
const cbs = {}; let cbN = 0;
window.__cb = (id, ok, txt) => { const f = cbs[id]; delete cbs[id]; if (f) f(ok, txt); };
function chamar(fn, ...args) {
  return new Promise((res, rej) => {
    const id = 'c' + (++cbN);
    cbs[id] = (ok, t) => ok ? res(t) : rej(new Error(t));
    const r = B[fn](...args, id);
    // versão PC devolve uma Promise em vez de responder por window.__cb
    if (r && typeof r.then === 'function') r.then(t => window.__cb(id, true, t), e => window.__cb(id, false, String((e && e.message) || e)));
  });
}
function ler(chave, padrao) {
  try { const v = B.load(chave); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; }
}
function alertas() { try { return JSON.parse(B.alertas()); } catch (e) { return []; } }

/* ===================== Tema ===================== */
var tema = ler('tema', 'auto');
function sistemaEscuro() {
  try { return B.temaSistemaEscuro ? !!B.temaSistemaEscuro() : matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; }
}
function aplicarTema() {
  const escuro = tema === 'escuro' || (tema === 'auto' && sistemaEscuro());
  document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
  try { B.barras && B.barras(escuro ? '#08090C' : '#F3F4F6', !escuro); } catch (e) { }
  try {   // na abertura do app as telas ainda não existem
    if (view === 'detalhe') grafico.desenhar();
    if (view === 'carteira') desenharHist();
  } catch (e) { }
}
window.aplicarTema = aplicarTema;
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => tema === 'auto' && aplicarTema()); } catch (e) { }
function mudarTema(t) { tema = t; gravar('tema', t); aplicarTema(); if (view === 'medias') telaMedias(); }
aplicarTema();

/* ===================== Sincronização (Planilha Google) ===================== */
var SINC = ['lista', 'medias', 'ifr', 'carteira', 'fundHist'], syncPronto = false, syncTimer = null;
function gravar(chave, v) { B.save(chave, JSON.stringify(v)); if (SINC.includes(chave)) agendarSync(); }
function syncConfig() { return !!(B.sincronizar && B.load('syncUrl') && B.load('syncChave')); }
function agendarSync() {
  if (!syncConfig()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => sincronizarAgora(true), 2500);
}
async function sincronizarAgora(silencioso) {
  if (!syncConfig()) { syncPronto = true; return; }
  try {
    const r = await chamar('sincronizar');
    syncPronto = true;
    if (/recebido/.test(r)) aplicarRemoto();
    if (!silencioso) toast(r);
  } catch (e) {
    syncPronto = true;
    if (!silencioso) toast('Sincronização: ' + e.message);
  }
  if (view === 'medias' && $('syncStatus')) $('syncStatus').innerHTML = statusSync();
}
function recarregarEstado() {
  lista = ler('lista', lista); medias = ler('medias', medias);
  ifrCfg = Object.assign({ p: 9, mm: 9, sup: 70, inf: 30, on: true }, ler('ifr', {}));
  cart = ler('carteira', null) || cart;
  fundHist = ler('fundHist', {});
}
function aplicarRemoto() {
  recarregarEstado();
  const f = $('folha'); if (f && f.style.display === 'block') return;
  if (view === 'detalhe') { listarAlertasAtivo(); desenharDetalhe(); if (dividida()) atualizarLista(); }
  else if (view === 'lista') atualizarLista();
  else if (view === 'carteira') telaCarteira();
  else render();
}
window.aoSincronizar = aplicarRemoto;
function statusSync() {
  if (!syncConfig()) return 'Não configurada — cada aparelho tem seus próprios dados.';
  const u = +B.load('ultimaSync');
  return u ? 'Última sincronização: ' + new Date(u).toLocaleString('pt-BR') : 'Ainda não sincronizou.';
}

function sma(v, p) {
  const o = new Array(v.length).fill(null); if (p <= 1) return v.slice();
  let s = 0;
  for (let i = 0; i < v.length; i++) { s += v[i]; if (i >= p) s -= v[i - p]; if (i >= p - 1) o[i] = s / p; }
  return o;
}
function ema(v, p) {
  const o = new Array(v.length).fill(null); if (p <= 1) return v.slice();
  if (v.length < p) return o;
  const k = 2 / (p + 1); let e = 0;
  for (let i = 0; i < p; i++) e += v[i];
  e /= p; o[p - 1] = e;
  for (let i = p; i < v.length; i++) { e = v[i] * k + e * (1 - k); o[i] = e; }
  return o;
}
const mm = (v, p, t) => t === 'EMA' ? ema(v, p) : sma(v, p);
// IFR (RSI) de Wilder
function ifr(v, p) {
  const o = new Array(v.length).fill(null);
  if (v.length <= p) return o;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = v[i] - v[i - 1]; if (d > 0) g += d; else l -= d; }
  g /= p; l /= p;
  o[p] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  for (let i = p + 1; i < v.length; i++) {
    const d = v[i] - v[i - 1];
    g = (g * (p - 1) + Math.max(d, 0)) / p; l = (l * (p - 1) + Math.max(-d, 0)) / p;
    o[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return o;
}
// média simples de uma série que começa com vazios
function smaN(v, p) {
  const i0 = v.findIndex(x => x != null);
  const o = new Array(v.length).fill(null);
  if (i0 < 0) return o;
  const r = sma(v.slice(i0), p);
  for (let i = 0; i < r.length; i++) o[i0 + i] = r[i];
  return o;
}

const URL_Y = 'https://query1.finance.yahoo.com/v8/finance/chart/';
function interpretar(txt) {

  const pts = [];

    const ab = o[i] != null ? o[i] : c[i];
    pts.push({ t: ts[i], c: c[i], o: ab, h: hi[i] != null ? hi[i] : Math.max(ab, c[i]), l: lo[i] != null ? lo[i] : Math.min(ab, c[i]), v: vol[i] || 0 });

async function buscarCotacao(sym) {
  const txt = await chamar('fetch', URL_Y + encodeURIComponent(sym) + '?range=5d&interval=1d');
  const d = interpretar(txt);
  // um ponto por dia (fora do pregão o Yahoo repete o último dia)
  const porDia = {};
  d.pts.forEach(x => porDia[new Date((x.t - 3 * 3600) * 1000).toISOString().slice(0, 10)] = x);
  const p = Object.keys(porDia).sort().map(k => porDia[k]);
  let anterior = p.length >= 2 ? p[p.length - 2].c : null;
  // se o último ponto não for de hoje e o preço já mudou, a variação é contra o último fechamento
  if (p.length && Math.abs(p[p.length - 1].c - d.preco) > 1e-9 && (Date.now() / 1000 - p[p.length - 1].t) > 86400) anterior = p[p.length - 1].c;

    const antes = d.pts.filter(x => diaBR(x.t + 3 * 3600) < dia && diaBR(x.t) < dia);
    if (antes.length) anterior = antes[antes.length - 1].c;

// Data (no horário de Brasília) de um instante do Yahoo
const diaDe = t => new Date((t - 3 * 3600) * 1000).toISOString().slice(0, 10);
function chaveSemana(dia) {   // segunda-feira da semana
  const d = new Date(dia + 'T12:00:00Z'), dow = (d.getUTCDay() + 6) % 7;

function agregar(diarios, f) {
  if (f === 'd') return diarios;
  const out = [];
  let chaveAtual = null, b = null;
  diarios.forEach(p => {
    const dia = diaDe(p.t), k = f === 'm' ? dia.slice(0, 7) : chaveSemana(dia);
    if (k !== chaveAtual) { chaveAtual = k; b = { t: p.t, o: p.o, h: p.h, l: p.l, c: p.c, v: p.v || 0 }; out.push(b); }
    else { b.h = Math.max(b.h, p.h); b.l = Math.min(b.l, p.l); b.c = p.c; b.v += p.v || 0; }

    const url = URL_Y + encodeURIComponent(sym) + '?period1=0&period2=' + Math.floor(Date.now() / 1000 + 86400) + '&interval=1d';
    const d = interpretar(await chamar('fetch', url));

    const base = [];

async function desenharDetalhe() {

  catch (e) { if (view === 'detalhe') $('graf').innerHTML = `<div class="carregando">Não consegui carregar o histórico.<br><span class="sub">${esc(e.message).slice(0, 120)}</span></div>`; return; }

  const pts = h[f], v = pts.map(p => p.c);
  const series = medias.map(m => ({ m, val: mm(v, m.p, m.t) }));
  const ini = Math.max(0, pts.length - n);
  const rsi = ifr(v, ifrCfg.p), rsiMM = smaN(rsi, ifrCfg.mm);

    ifr: ifrCfg.on ? { val: rsi.slice(ini), mm: rsiMM.slice(ini) } : null };

    `<span class="chip ${ifrCfg.on ? 'on' : 'off'}" onclick="alternarIFR()"><i style="background:#F23645"></i>IFR(${ifrCfg.p})</span>`;
  // sinal
  let txt = '';
  const ativas = series.filter(x => x.m.on && x.m.p > 1).sort((a, b) => a.m.p - b.m.p);
  const ultimo = v[v.length - 1];
  if (ativas.length) {
    const partes = ativas.map(x => {
      const val = x.val[x.val.length - 1];
      if (val == null) return `${nomeMM(x.m)}: histórico insuficiente`;
      return `Preço ${ultimo >= val ? '<b class="alta">acima</b>' : '<b class="baixa">abaixo</b>'} da ${nomeMM(x.m)} (${num(val)})`;
    });
    if (ativas.length >= 2) {
      const a = ativas[0], b = ativas[ativas.length - 1];
      const va = a.val[a.val.length - 1], vb = b.val[b.val.length - 1];
      if (va != null && vb != null) partes.push(`${nomeMM(a.m)} ${va > vb ? '<b class="alta">acima</b>' : '<b class="baixa">abaixo</b>'} da ${nomeMM(b.m)} → tendência de ${va > vb ? 'alta' : 'baixa'}`);

    txt += (txt ? '<br>' : '') + `IFR(${ifrCfg.p}) ${num(rU, 1)} → ${est}`;

/* --- gráfico em canvas --- */
const grafico = {
  dados: null, toque: null,
  desenhar() {
    const cv = $('cv'); if (!cv || !this.dados) return;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const { pts, series, f } = this.dados, R = this.dados.ifr;
    if (pts.length < 2) return;
    const padL = 6, padR = 58, padT = 10, padB = 22;
    const util = H - padT - padB, ifrH = R ? util * 0.24 : 0, gap = R ? 14 : 0;
    const baseP = H - padB - ifrH - gap;          // fundo da área de preço
    const ifrTop = baseP + gap;
    let lo = Infinity, hi = -Infinity;
    pts.forEach(p => { lo = Math.min(lo, modo === 'candle' ? p.l : p.c); hi = Math.max(hi, modo === 'candle' ? p.h : p.c); });
    series.forEach(s => s.val.forEach(x => { if (x != null) { lo = Math.min(lo, x); hi = Math.max(hi, x); } }));
    const linhasAl = alertas().filter(a => a.sym === atual && a.ativo && (a.tipo === 'abaixo' || a.tipo === 'acima'));
    linhasAl.forEach(a => { lo = Math.min(lo, a.valor); hi = Math.max(hi, a.valor); });
    const marg = (hi - lo) * 0.06 || hi * 0.01 || 1; lo -= marg; hi += marg;
    // cada barra ocupa uma "fatia" igual: primeiro e último candle aparecem inteiros
    const X = i => padL + (W - padL - padR) * (i + 0.5) / pts.length;
    const areaP = (baseP - padT) * 0.84;
    const Y = v => padT + areaP * (1 - (v - lo) / (hi - lo));
    this.X = X; this.padL = padL; this.padR = padR; this.W = W;
    // grade
    g.font = '11px system-ui, sans-serif'; g.textBaseline = 'middle';
    const passo = niceStep((hi - lo) / 5);
    for (let y = Math.ceil(lo / passo) * passo; y <= hi && Y(y) <= baseP; y += passo) {
      g.strokeStyle = C('grade'); g.lineWidth = 1; g.beginPath(); g.moveTo(padL, Y(y)); g.lineTo(W - padR, Y(y)); g.stroke();
      g.fillStyle = C('eixo'); g.fillText(num(y, passo < 1 ? 2 : 0), W - padR + 6, Y(y));
    }
    // datas
    g.textBaseline = 'alphabetic'; g.textAlign = 'center';
    const nd = 4;
    for (let k = 0; k < nd; k++) {
      const i = Math.round((pts.length - 1) * (k + 0.5) / nd);
      const d = new Date(pts[i].t * 1000);
      g.fillStyle = C('eixo');
      g.fillText(d.toLocaleDateString('pt-BR', f !== 'd' ? { month: 'short', year: '2-digit' } : { day: '2-digit', month: 'short' }), X(i), H - 6);
    }
    g.textAlign = 'left';
    // linhas de alerta
    linhasAl.forEach(a => {
      const cor = a.tipo === 'abaixo' ? '#2FD39A' : '#FF5C6C';
      g.setLineDash([5, 4]); g.strokeStyle = cor; g.lineWidth = 1;
      g.beginPath(); g.moveTo(padL, Y(a.valor)); g.lineTo(W - padR, Y(a.valor)); g.stroke(); g.setLineDash([]);
      g.fillStyle = cor; g.fillRect(W - padR + 2, Y(a.valor) - 8, padR - 2, 16);
      g.fillStyle = '#08090C'; g.textBaseline = 'middle'; g.fillText(num(a.valor), W - padR + 6, Y(a.valor));
    });
    // volume (faixa de baixo da área de preço)
    const vH = (baseP - padT) * 0.16, vMax = Math.max(...pts.map(p => p.v || 0)) || 1;
    const larg = Math.max(1, (W - padL - padR) / pts.length * 0.7);
    pts.forEach((p, i) => {
      if (!p.v) return;
      const h = vH * p.v / vMax;
      g.fillStyle = p.c >= p.o ? 'rgba(25,195,125,.28)' : 'rgba(242,54,69,.28)';
      g.fillRect(X(i) - larg / 2, baseP - h, larg, h);
    });
    const sobe = pts[pts.length - 1].c >= (pts.length > 1 ? pts[pts.length - 2].c : pts[0].c), corP = sobe ? '#19C37D' : '#F23645';
    if (modo === 'candle') {
      pts.forEach((p, i) => {
        const cor = p.c >= p.o ? '#19C37D' : '#F23645';
        g.strokeStyle = cor; g.fillStyle = cor; g.lineWidth = 1;
        g.beginPath(); g.moveTo(X(i), Y(p.h)); g.lineTo(X(i), Y(p.l)); g.stroke();
        const y1 = Y(Math.max(p.o, p.c)), y2 = Y(Math.min(p.o, p.c));
        g.fillRect(X(i) - larg / 2, y1, larg, Math.max(1, y2 - y1));
      });
    } else {
      const grad = g.createLinearGradient(0, padT, 0, H - padB);
      grad.addColorStop(0, 'rgba(47,123,255,.25)'); grad.addColorStop(1, 'rgba(47,123,255,0)');
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(i), Y(p.c)) : g.moveTo(X(i), Y(p.c)));
      g.lineTo(X(pts.length - 1), baseP); g.lineTo(X(0), baseP); g.closePath(); g.fillStyle = grad; g.fill();
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(i), Y(p.c)) : g.moveTo(X(i), Y(p.c)));
      g.strokeStyle = '#2F7BFF'; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
    }
    // médias
    series.forEach(s => {
      g.beginPath(); let on = false;
      s.val.forEach((x, i) => { if (x == null) { on = false; return; } on ? g.lineTo(X(i), Y(x)) : g.moveTo(X(i), Y(x)); on = true; });
      g.strokeStyle = corLinha(s.m.c); g.lineWidth = 1.5; g.stroke();
    });
    // último preço
    const ult = pts[pts.length - 1].c;
    g.fillStyle = corP; g.fillRect(W - padR + 2, Y(ult) - 9, padR - 2, 18);
    g.fillStyle = '#08090C'; g.font = 'bold 11px system-ui, sans-serif'; g.textBaseline = 'middle'; g.fillText(num(ult), W - padR + 6, Y(ult));
    // painel do IFR
    if (R) {
      const YI = v => ifrTop + ifrH * (1 - v / 100);
      g.fillStyle = 'rgba(138,147,163,.07)'; g.fillRect(padL, YI(ifrCfg.sup), W - padL - padR, YI(ifrCfg.inf) - YI(ifrCfg.sup));
      g.strokeStyle = C('linha'); g.lineWidth = 1; g.strokeRect(padL + .5, ifrTop + .5, W - padL - padR - 1, ifrH - 1);
      g.setLineDash([4, 4]); g.strokeStyle = C('cruz');
      [ifrCfg.sup, ifrCfg.inf].forEach(n => { g.beginPath(); g.moveTo(padL, YI(n)); g.lineTo(W - padR, YI(n)); g.stroke(); });
      g.setLineDash([]);
      g.font = '11px system-ui, sans-serif'; g.textBaseline = 'middle'; g.fillStyle = C('eixo');
      [ifrCfg.sup, ifrCfg.inf].forEach(n => g.fillText(num(n, 0), W - padR + 6, YI(n)));
      const linha = (arr, cor, lw) => {
        g.beginPath(); let on = false;
        arr.forEach((x, i) => { if (x == null) { on = false; return; } on ? g.lineTo(X(i), YI(x)) : g.moveTo(X(i), YI(x)); on = true; });
        g.strokeStyle = cor; g.lineWidth = lw; g.stroke();
      };
      linha(R.mm, corLinha('#00E5FF'), 1.2);
      linha(R.val, '#F23645', 1.6);
      const ru = R.val[R.val.length - 1];
      if (ru != null) {
        g.fillStyle = '#F23645'; g.fillRect(W - padR + 2, YI(ru) - 8, padR - 2, 16);
        g.fillStyle = '#fff'; g.font = 'bold 11px system-ui, sans-serif'; g.fillText(num(ru), W - padR + 6, YI(ru));
      }
      g.font = '11px system-ui, sans-serif'; g.fillStyle = C('sub'); g.textBaseline = 'top';
      g.fillText(`IFR (${ifrCfg.p})  ·  MM ${ifrCfg.mm}`, padL + 6, ifrTop + 4);
    }
    // toque / legenda (sem toque mostra o último candle, como no Profit)
    const i = this.toque != null ? this.toque : pts.length - 1, p = pts[i];
    if (this.toque != null) {
      g.strokeStyle = C('cruz'); g.lineWidth = 1; g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(X(i), padT); g.lineTo(X(i), H - padB); g.stroke(); g.setLineDash([]);
      g.fillStyle = C('txt'); g.beginPath(); g.arc(X(i), Y(p.c), 4, 0, 7); g.fill();
    }
    const rotBarra = f === 'm' ? new Date((p.t - 3 * 3600) * 1000).toLocaleDateString('pt-BR', { month: 'short', year: '2-digit', timeZone: 'UTC' })
      : f === 'w' ? 'semana de ' + dataBR(p.t) : dataBR(p.t);
    $('info').innerHTML = `<b style="color:var(--txt)">${rotBarra}</b> A ${num(p.o)} M ${num(p.h)} m ${num(p.l)} F <b style="color:${p.c >= p.o ? 'var(--alta)' : 'var(--baixa)'}">${num(p.c)}</b><br>` +
      series.map(s => s.val[i] != null ? `<span style="color:${corLinha(s.m.c)}">${nomeMM(s.m)} ${num(s.val[i])}</span>` : '').join(' ') +
      (R && R.val[i] != null ? ` <span style="color:#F23645">IFR ${num(R.val[i], 1)}</span>` : '');
  }
};
// cores do tema para os gráficos
const C = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
const temaClaro = () => document.documentElement.dataset.tema === 'claro';
function corLinha(c) {   // no tema claro, escurece linhas muito claras (ex.: MM80 branca)
  if (!temaClaro() || !/^#[0-9a-f]{6}$/i.test(c)) return c;
  const v = [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
  const lum = (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
  if (lum < 0.6) return c;
  const f = lum > 0.85 ? 0.15 : 0.6;
  return '#' + v.map(x => Math.round(x * f).toString(16).padStart(2, '0')).join('');
}

// --- leitor de .xlsx (zip + xml) sem bibliotecas ---
async function inflar(dados) {
  if (typeof DecompressionStream === 'undefined') throw new Error('Este aparelho não consegue abrir .xlsx. Atualize o “Android System WebView” na Play Store.');
  const s = new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function lerZip(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  let e = b.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('O arquivo não é um Excel (.xlsx) válido.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const arqs = {}, td = new TextDecoder('utf-8');
  for (let i = 0; i < n; i++) {
    const metodo = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true);
    const ln = dv.getUint16(p + 28, true), lx = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true), nome = td.decode(b.subarray(p + 46, p + 46 + ln));
    const ini = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const bruto = b.subarray(ini, ini + tam);
    arqs[nome] = async () => td.decode(metodo === 0 ? bruto : await inflar(bruto));
    p += 46 + ln + lx + lc;
  }
  return arqs;
}
async function lerXLSX(b) {
  const z = await lerZip(b), xml = async n => z[n] ? new DOMParser().parseFromString(await z[n](), 'application/xml') : null;
  const tag = (d, t) => [...d.getElementsByTagName(t)];
  const ss = [], dss = await xml('xl/sharedStrings.xml');
  if (dss) tag(dss, 'si').forEach(si => ss.push(tag(si, 't').map(t => t.textContent).join('')));
  const wb = await xml('xl/workbook.xml'), rels = await xml('xl/_rels/workbook.xml.rels');
  if (!wb) throw new Error('O arquivo não é um Excel (.xlsx) válido.');
  const alvo = {};
  if (rels) tag(rels, 'Relationship').forEach(r => alvo[r.getAttribute('Id')] = r.getAttribute('Target'));
  const out = {};
  for (const sh of tag(wb, 'sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let t = alvo[rid] || ''; t = t.replace(/^\/?xl\//, '').replace(/^\//, '');
    const d = await xml('xl/' + t); if (!d) continue;
    const linhas = [];
    tag(d, 'row').forEach(row => {
      const l = [];
      tag(row, 'c').forEach(c => {
        const ref = c.getAttribute('r') || '', col = ref.replace(/\d+/g, '');
        let idx = 0; for (const ch of col) idx = idx * 26 + ch.charCodeAt(0) - 64; idx--;
        const tp = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0];
        let v = vEl ? vEl.textContent : '';
        if (tp === 's') v = ss[+v] || '';
        else if (tp === 'inlineStr') v = tag(c, 't').map(x => x.textContent).join('');
        l[idx >= 0 ? idx : l.length] = v;
      });
      linhas.push(Array.from(l, x => x == null ? '' : String(x).trim()));
    });
    out[sh.getAttribute('name')] = linhas;
  }
  return out;
}
function lerCSV(txt) {
  const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  return txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep).map(x => x.replace(/^"|"$/g, '').trim()));
}
function numBR(x) {
  if (x == null || x === '' || x === '-') return NaN;
  if (typeof x === 'number') return x;
  let s = String(x).replace(/R\$|\s/g, '');
  if (/^-?\d+(\.\d+)?(e-?\d+)?$/i.test(s)) return parseFloat(s);   // número do próprio Excel
  return parseFloat(s.replace(/\./g, '').replace(',', '.'));
}
function dataNum(x) {
  if (/^\d+(\.\d+)?$/.test(x)) return +x;                         // data serial do Excel
  const m = String(x).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) / 864e5 + 25569 : 0;
}
const semAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

  }
  return null;
}
function catPorNome(nomes, criar) {

  for (const n of nomes) { const c = cart.cats.find(x => semAcento(x.nome).includes(semAcento(n))); if (c) return c.id; }
  const c = { id: novoId(), nome: criar, meta: 0, cor: CORES[cart.cats.length % CORES.length] };
  cart.cats.push(c); return c.id;
}
function tipoPorTicker(t, aba) {
  const a = semAcento(aba);
  if (a.includes('bdr') || /3[1-5]$/.test(t)) return 'bdr';
  if (a.includes('fundo') || a.includes('fii') || a.includes('imobili')) return 'fii';
  if (a.includes('etf')) return /^GOLD|^OURO/.test(t) ? 'ouro' : 'etf';
  if (a.includes('acoes') || a.includes('acao')) return 'acao';
  return /11$/.test(t) ? 'fii' : 'acao';
}
function catPorTipo(tp) {
  return tp === 'bdr' ? catPorNome(['BDR'], 'BDR') : tp === 'fii' ? catPorNome(['FII', 'FIIS'], 'FII')
    : tp === 'ouro' ? catPorNome(['OURO'], 'OURO') : tp === 'etf' ? catPorNome(['ETF', 'ETFS'], 'ETF')
    : catPorNome(['DY', 'ACOES', 'AÇÕES'], 'AÇÕES');
}
const limparTicker = t => String(t).toUpperCase().replace(/\s/g, '').replace(/F$/, '');

function aplicarImportacao(planilhas) {
  const pos = {}, neg = {}, manuais = [], mov = {};
  let provRecebidos = 0, movIgnoradas = 0, temMov = false, temEventos = false;
  const aReceber = [];
  const provsExtrato = [];
  for (const [aba, linhas] of Object.entries(planilhas)) {
    // Extrato de Eventos: proventos a receber (valor líquido e previsão de pagamento)
    const ce = acharCabecalho(linhas, ['produto', 'tipo de evento', 'previsao de pagamento', 'valor liquido']);
    if (ce) {
      temEventos = true;
      const cP = ce.col('produto'), cT = ce.col('tipo de evento'), cD = ce.col('previsao de pagamento'), cQ = ce.col('quantidade'), cV = ce.col('valor liquido');
      for (let i = ce.i + 1; i < linhas.length; i++) {
        const l = linhas[i], tk = limparTicker(String(l[cP] || '').split(' - ')[0]), v = numBR(l[cV]);
        const d = dataBRparaISO(l[cD]) || (/^\d+(\.\d+)?$/.test(String(l[cD])) ? new Date((+l[cD] - 25569) * 864e5).toISOString().slice(0, 10) : null);
        if (!/^[A-Z]{4}\d{1,2}$/.test(tk) || !(v > 0) || !d) continue;
        aReceber.push({ pag: d, tk, v: +v.toFixed(2), tipo: String(l[cT] || '').trim(), q: numBR(l[cQ]) || null });
      }
      continue;
    }
    // Extrato de Movimentação: compras/vendas (Transferência - Liquidação), desdobramentos e proventos
    let cm = acharCabecalho(linhas, ['entrada/saida', 'movimentacao', 'produto', 'quantidade']);
    if (cm) {
      temMov = true;
      const cES = cm.col('entrada/saida'), cD = cm.col('data'), cM = cm.col('movimentacao'), cP = cm.col('produto'),
        cQ = cm.col('quantidade'), cPr = cm.col('preco'), cV = cm.col('valor da operacao');
      const ops = [];
      for (let i = cm.i + 1; i < linhas.length; i++) {
        const l = linhas[i], prod = String(l[cP] || ''), tipo = semAcento(l[cM] || ''), credito = semAcento(l[cES] || '').startsWith('c');
        const tk = limparTicker(prod.split(' - ')[0]);
        const q = numBR(l[cQ]), pr = numBR(l[cPr]), val = numBR(l[cV]);
        if (/rendimento|dividendo|juros sobre capital/.test(tipo)) {
          if (credito && val > 0) {
            provRecebidos += val;
            const dIso = dataBRparaISO(l[cD]) || (typeof l[cD] === 'string' ? null : new Date((dataNum(l[cD]) - 25569) * 864e5).toISOString().slice(0, 10));
            if (dIso) provsExtrato.push({ pag: dIso, tk, v: +val.toFixed(2), tipo: String(l[cM] || '').trim(), q: q > 0 ? q : null });
          }
          continue;
        }
        if (!/^[A-Z]{4}\d{1,2}$/.test(tk)) { movIgnoradas++; continue; }   // CDB, Tesouro etc.
        const nome = semAcento(prod);
        const abaTk = /fii|fdo inv imob|fundo de investimento imob|imobiliario/.test(nome) ? 'fundo' : /\bdrn\b|\bbdr\b|depositary/.test(nome) ? 'bdr' : /\betf\b|indice/.test(nome) ? 'etf' : 'acoes';
        let op = null;
        if (/liquidacao|compra|venda/.test(tipo)) op = credito ? 'compra' : 'venda';
        else if (/desdobr|bonifica|atualizacao/.test(tipo) && credito) op = 'ganho';
        else if (/grupamento/.test(tipo)) op = credito ? 'ganho' : 'perda';
        if (!op || !(q > 0)) { movIgnoradas++; continue; }
        ops.push({ d: dataNum(l[cD]), tk, q, pr: pr > 0 ? pr : 0, op, aba: abaTk, ordem: i });
      }
      // a planilha vem do mais novo para o mais antigo
      ops.sort((a, b) => a.d - b.d || b.ordem - a.ordem).forEach(o => {
        const x = mov[o.tk] = mov[o.tk] || { q: 0, custo: 0, aba: o.aba };
        if (o.op === 'compra') { x.q += o.q; x.custo += o.q * o.pr; }
        else if (o.op === 'ganho') x.q += o.q;
        else if (o.op === 'perda') x.q = Math.max(0, x.q - o.q);
        else { const pm = x.q ? x.custo / x.q : 0; x.q = Math.max(0, x.q - o.q); x.custo = pm * x.q; }
      });
      continue;
    }
    // Extrato de Negociação: compras e vendas → quantidade e preço médio
    let c = acharCabecalho(linhas, ['data do negocio', 'codigo de negociacao', 'quantidade', 'preco']);
    if (c) {
      const cD = c.col('data do negocio'), cT = c.col('tipo de movimentacao'), cC = c.col('codigo de negociacao'),
        cQ = c.col('quantidade'), cP = c.col('preco'), ops = [];
      for (let i = c.i + 1; i < linhas.length; i++) {
        const l = linhas[i], tk = limparTicker(l[cC] || ''); if (!tk) continue;
        const q = numBR(l[cQ]), p = numBR(l[cP]); if (!(q > 0)) continue;
        ops.push({ d: dataNum(l[cD]), tk, q, p, venda: semAcento(l[cT] || '').startsWith('v') });
      }
      ops.sort((a, b) => a.d - b.d).forEach(o => {
        const x = neg[o.tk] = neg[o.tk] || { q: 0, custo: 0, aba };
        if (o.venda) { const pm = x.q ? x.custo / x.q : 0; x.q = Math.max(0, x.q - o.q); x.custo = pm * x.q; }
        else { x.q += o.q; x.custo += o.q * o.p; }
      });
      continue;
    }
    // Extrato de Posição: ações, FIIs, BDRs, ETFs
    c = acharCabecalho(linhas, ['codigo de negociacao', 'quantidade']);
    if (c) {
      const cC = c.col('codigo de negociacao'), cQ = c.col('quantidade');
      for (let i = c.i + 1; i < linhas.length; i++) {
        const tk = limparTicker(linhas[i][cC] || ''), q = numBR(linhas[i][cQ]);
        if (!/^[A-Z0-9]{4,6}\d{0,2}$/.test(tk) || !(q > 0)) continue;
        pos[tk] = { q: (pos[tk] ? pos[tk].q : 0) + q, aba };
      }
      continue;
    }
    // Tesouro Direto / Renda Fixa: entram como valor manual
    c = acharCabecalho(linhas, ['produto', 'valor atualizado']);
    if (c) {
      const cP = c.col('produto'), cV = c.col('valor atualizado');
      for (let i = c.i + 1; i < linhas.length; i++) {
        const nome = linhas[i][cP], v = numBR(linhas[i][cV]);
        if (nome && v > 0 && !/^total/i.test(nome)) manuais.push({ nome, v });
      }
    }
  }
  const nPos = Object.keys(pos).length, nNeg = Object.keys(neg).length, nMov = Object.keys(mov).length;
  // proventos recebidos: guarda na carteira sem duplicar
  cart.proventos = cart.proventos || [];
  const chaveProv = p => [p.pag, p.tk, semAcento(p.tipo), p.v].join('|');
  const jaTem = new Set(cart.proventos.map(chaveProv));
  let provNovos = 0;
  provsExtrato.forEach(p => { if (!jaTem.has(chaveProv(p))) { cart.proventos.push(p); jaTem.add(chaveProv(p)); provNovos++; } });
  cart.proventos.sort((a, b) => a.pag < b.pag ? -1 : 1);
  // a receber: o extrato de Eventos é a foto atual, então substitui a lista anterior
  if (temEventos) { cart.aReceber = aReceber.sort((a, b) => a.pag < b.pag ? -1 : 1); cart.aReceberEm = Date.now(); }
  if (!nPos && !nNeg && !manuais.length && !nMov && !provsExtrato.length && !temEventos) throw new Error(temMov
    ? 'O extrato de Movimentação não tem compras ou vendas de ações/FIIs nesse período. Para as quantidades, use o Excel de Extratos › Posição.'
    : 'Não encontrei ativos neste arquivo.');
  const novos = [], atualizados = [];
  const acharItem = tk => cart.itens.find(i => i.sym && limparTicker(rot(i.sym)) === tk);
  const symDe = tk => /^[A-Z]{4}\d{1,2}$/.test(tk) ? tk + '.SA' : tk;
  for (const [tk, x] of Object.entries(pos)) {
    let it = acharItem(tk);
    if (it) { it.qtd = x.q; atualizados.push(tk); }
    else { cart.itens.push({ id: novoId(), cat: catPorTipo(tipoPorTicker(tk, x.aba)), sym: symDe(tk), qtd: x.q, pm: null, b3: true }); novos.push(tk); }
  }
  let comPM = 0;
  for (const [tk, x] of Object.entries(neg)) {
    if (!(x.q > 0)) continue;
    let it = acharItem(tk);
    if (!it) { it = { id: novoId(), cat: catPorTipo(tipoPorTicker(tk, x.aba)), sym: symDe(tk), qtd: x.q, b3: true }; cart.itens.push(it); novos.push(tk); }
    it.pm = +(x.custo / x.q).toFixed(4); comPM++;
  }
  // Movimentação: cria os ativos novos; nos que já existem só ajusta o preço médio se a quantidade bater
  // (o extrato pode cobrir só parte do histórico)
  const movPM = [], movDif = [];
  for (const [tk, x] of Object.entries(mov)) {
    if (!(x.q > 0)) continue;
    const it = acharItem(tk), pm = x.custo > 0 ? +(x.custo / x.q).toFixed(4) : null;
    if (!it) { cart.itens.push({ id: novoId(), cat: catPorTipo(tipoPorTicker(tk, x.aba)), sym: symDe(tk), qtd: x.q, pm, b3: true }); novos.push(tk); }
    else if (Math.abs((+it.qtd || 0) - x.q) < 1e-6) { if (pm) { it.pm = pm; movPM.push(tk); } }
    else movDif.push(tk);
  }
  const caixa = manuais.length ? catPorNome(['CAIXA', 'RENDA FIXA'], 'CAIXA') : null;
  manuais.forEach(m => {
    const it = cart.itens.find(i => !i.sym && i.nome === m.nome);
    if (it) it.valor = m.v; else cart.itens.push({ id: novoId(), cat: caixa, nome: m.nome, valor: m.v, b3: true });
  });
  const fora = nPos ? cart.itens.filter(i => i.sym && i.b3 && !pos[limparTicker(rot(i.sym))]).map(i => rot(i.sym)) : [];
  let r = '';
  if (novos.length) r += `<b>${novos.length}</b> ativo(s) novo(s): ${[...new Set(novos)].join(', ')}<br>`;
  if (atualizados.length) r += `<b>${atualizados.length}</b> quantidade(s) atualizada(s)<br>`;
  if (comPM) r += `Preço médio calculado para <b>${comPM}</b> ativo(s)<br>`;
  if (manuais.length) r += `<b>${manuais.length}</b> título(s) de Tesouro/Renda Fixa na lista CAIXA<br>`;
  if (movPM.length) r += `Preço médio atualizado pela movimentação: ${movPM.join(', ')}<br>`;
  if (temEventos) r += `<b>${aReceber.length}</b> provento(s) a receber, total <b>${dinheiro(aReceber.reduce((s, p) => s + p.v, 0))}</b> (Carteira › A receber e Painel)<br>`;
  if (provRecebidos > 0) r += `Proventos recebidos no período do extrato: <b>${dinheiro(provRecebidos)}</b>${provNovos ? ` (${provNovos} pagamento(s) guardado(s) em Carteira › Proventos recebidos)` : ' (já estavam guardados)'}<br>`;
  if (movDif.length) r += `<br><span class="sub">${movDif.join(', ')}: a quantidade da carteira é diferente da soma do extrato (ele deve cobrir só parte do histórico). Não mexi nesses.</span><br>`;
  if (temMov) r += `<br><span class="sub">O extrato de Movimentação cobre só o período escolhido na B3. Para conferir as quantidades totais, importe também o Excel de <b>Extratos › Posição</b>.${movIgnoradas ? ' Linhas de CDB, Tesouro e outros eventos foram ignoradas.' : ''}</span>`;
  if (fora.length) r += `<br><span class="sub">Não estão mais na posição da B3: ${fora.join(', ')}. Se vendeu, exclua da carteira.</span>`;
  return r || 'Nada mudou.';
}

/* ===================== Indicadores (Fundamentus + Bolsai) ===================== */
const FUNDAMENTUS = 'https://www.fundamentus.com.br/';
const BOLSAI = 'https://api.usebolsai.com/api/v1/';
const fundMem = {}, provMem = {};
let fundCache = ler('fundCache', {});      // { sym: { t, d } } — só neste aparelho

const chaveBolsai = () => (B.load('bolsaiChave') || '').trim();
const ehB3 = s => /\.SA$/.test(s);
async function buscarTexto(url, cab) {
  if (B.fetchCom) return chamar('fetchCom', url, cab ? JSON.stringify(cab) : '');
  return chamar('fetch', url);
}
async function bolsai(caminho) {

const numF = x => { const v = numBR(String(x == null ? '' : x).replace('%', '')); return isNaN(v) ? null : v; };

// lê as tabelas "rótulo → valor" do Fundamentus
function lerTabelaFundamentus(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html'), out = {};

    if (r && out[r] == null) out[r] = ((tds[i + 1].querySelector('.txt') || tds[i + 1]).textContent || '').trim();
  });

}
function mapaAcao(t) {
  return {
    tipo: 'acao', fonte: 'Fundamentus', empresa: t['Empresa'] || '', setor: t['Setor'] || '', subsetor: t['Subsetor'] || '',
    dy: numF(t['Div. Yield']), pl: numF(t['P/L']), pvp: numF(t['P/VP']), roe: numF(t['ROE']), roic: numF(t['ROIC']),
    lpa: numF(t['LPA']), vpa: numF(t['VPA']), margLiq: numF(t['Marg. Líquida']), divPL: numF(t['Dív Líq/ Patrim']) ?? numF(t['Dív Líq / Patrim']),
    evEbitda: numF(t['EV / EBITDA']), valorMercado: numF(t['Valor de mercado']), liqCorr: numF(t['Liquidez Corr']),
    cresRec: numF(t['Cres. Rec (5a)']), min52: numF(t['Min 52 sem']), max52: numF(t['Max 52 sem']),
    lucro12m: numF(t['Lucro Líquido'])   // primeira ocorrência = últimos 12 meses
  };
}
function mapaFII(t) {
  return {
    tipo: 'fii', fonte: 'Fundamentus', empresa: t['Nome'] || '', setor: t['Segmento'] || '', mandato: t['Mandato'] || '',
    dy: numF(t['Div. Yield']), pvp: numF(t['P/VP']), vpa: numF(t['VP/Cota']), ffoYield: numF(t['FFO Yield']),
    dividendoCota: numF(t['Dividendo/cota']), valorMercado: numF(t['Valor de mercado']), vacancia: numF(t['Vacância Média']),
    imoveis: numF(t['Qtd imóveis']), min52: numF(t['Min 52 sem']), max52: numF(t['Max 52 sem'])
  };

async function buscarFund(sym, forcar) {
  if (!ehB3(sym)) return null;
  if (fundMem[sym] && !forcar) return fundMem[sym];
  const c = fundCache[sym];
  if (c && !forcar && Date.now() - c.t < 12 * 3600e3) return (fundMem[sym] = c.d);
  const T = rot(sym);
  let d = null, erro = null;
  // 1) ações e units no Fundamentus
  try {
    const t = lerTabelaFundamentus(await buscarTexto(FUNDAMENTUS + 'detalhes.php?papel=' + T));
    if (t['P/L'] != null || t['P/VP'] != null) d = t['Div. Yield'] != null && t['P/L'] == null ? mapaFII(t) : mapaAcao(t);
  } catch (e) { erro = e; }
  // 2) FIIs: Bolsai (com chave) ou página de FII do Fundamentus
  if (!d && /11$/.test(T)) {
    if (chaveBolsai()) {
      try {
        const j = await bolsai('fiis/' + T);
        d = { tipo: 'fii', fonte: 'Bolsai', empresa: j.name || '', setor: j.segment || '', mandato: j.fund_type || '',
          dy: j.dividend_yield_ttm, pvp: j.pvp, vpa: j.book_value_per_share, valorMercado: j.net_asset_value,
          vacancia: j.vacancy_pct, imoveis: j.property_count, cotistas: j.total_shareholders };
      } catch (e) { erro = e; }
    }
    if (!d) {
      try {
        const t = lerTabelaFundamentus(await buscarTexto(FUNDAMENTUS + 'fii_detalhes.php?papel=' + T));
        if (t['P/VP'] != null || t['Div. Yield'] != null) d = mapaFII(t);
      } catch (e) { erro = e; }
    }
  }
  // 3) ações pela Bolsai, se o Fundamentus falhar
  if (!d && chaveBolsai()) {
    try {
      const j = await bolsai('fundamentals/' + T);
      d = { tipo: 'acao', fonte: 'Bolsai', empresa: j.corporate_name || '', setor: '', dy: null, pl: j.pl, pvp: j.pvp,
        roe: j.roe, roic: j.roic, lpa: j.lpa, vpa: j.vpa, margLiq: j.net_margin, divPL: j.debt_equity,
        evEbitda: j.ev_ebitda, valorMercado: j.market_cap };
    } catch (e) { erro = erro || e; }
  }
  if (!d) {
    if (c) return (fundMem[sym] = c.d);   // usa o último que deu certo
    throw erro || new Error('sem indicadores para ' + T);
  }
  // DY de FII/ação sem DY: calcula pelos proventos dos últimos 12 meses
  if (d.dy == null) {
    try { const r = await historicoDY(sym); if (r && r.atual != null) d.dy = r.atual; } catch (e) { }
  }
  d.t = Date.now();
  fundMem[sym] = d;
  fundCache[sym] = { t: Date.now(), d }; gravar('fundCache', fundCache);
  guardarMesFund(sym, d);
  return d;
}
// registro mensal de P/L, P/VP e DY (vira o histórico quando não há fonte com histórico)
function guardarMesFund(sym, d) {
  const m = mesAtual(), h = fundHist[sym] = fundHist[sym] || {};
  const novo = { pl: d.pl ?? null, pvp: d.pvp ?? null, dy: d.dy ?? null };
  if (JSON.stringify(h[m]) === JSON.stringify(novo)) return;

/* --- proventos e histórico do DY --- */
async function buscarSplits(sym) {
  try {
    const j = JSON.parse(await chamar('fetch', URL_Y + encodeURIComponent(sym) + '?range=max&interval=1mo&events=split'));
    const sp = (((j.chart.result || [])[0] || {}).events || {}).splits || {};
    return Object.values(sp).map(x => ({ t: x.date, f: (+x.numerator || 1) / (+x.denominator || 1) })).filter(x => x.f > 0 && x.f !== 1);
  } catch (e) { return []; }
}
const dataBRparaISO = d => { const m = String(d).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
async function buscarProventos(sym) {
  if (provMem[sym] && Date.now() - provMem[sym].t < 6 * 3600e3) return provMem[sym].l;
  const T = rot(sym);
  let lista = [];
  for (const pag of [`proventos.php?papel=${T}&tipo=2`, `fii_proventos.php?papel=${T}&tipo=2`]) {
    try {
      const doc = new DOMParser().parseFromString(await buscarTexto(FUNDAMENTUS + pag), 'text/html');
      const tab = doc.querySelector('#resultado') || [...doc.querySelectorAll('table')].find(t => /valor/i.test(t.textContent));
      if (!tab) continue;
      const cab = [...tab.querySelectorAll('th')].map(th => semAcento(th.textContent));
      const iD = cab.findIndex(h => h.includes('data') && !h.includes('pagamento')), iV = cab.findIndex(h => h.includes('valor')),
        iT = cab.findIndex(h => h.includes('tipo')), iQ = cab.findIndex(h => h.includes('quantas')), iP = cab.findIndex(h => h.includes('pagamento'));
      tab.querySelectorAll('tbody tr').forEach(tr => {
        const td = [...tr.querySelectorAll('td')].map(x => x.textContent.trim());
        const d = dataBRparaISO(td[iD]), v = numF(td[iV]), q = iQ >= 0 ? numF(td[iQ]) || 1 : 1;
        if (d && v > 0) lista.push({ d, v: v / q, tipo: iT >= 0 ? td[iT] : '', pag: iP >= 0 ? dataBRparaISO(td[iP]) : null });
      });
      if (lista.length) break;
    } catch (e) { }
  }
  // Bolsai (plano Pro) como alternativa
  if (!lista.length && chaveBolsai()) {
    try {
      const j = await bolsai(`dividends/${T}?years=20`);
      lista = (j.payments || []).filter(p => p.ex_date && p.value_per_share > 0).map(p => ({ d: p.ex_date, v: +p.value_per_share, tipo: p.type || '', ajustado: !!p.adjusted, pag: p.payment_date || null }));
    } catch (e) { }
  }
  // o Fundamentus não ajusta desdobramentos/bonificações: ajusta pelo Yahoo
  const splits = await buscarSplits(sym);
  lista.forEach(p => {
    if (p.ajustado) return;
    const tp = Date.parse(p.d) / 1000;
    splits.forEach(s => { if (tp < s.t) p.v = p.v / s.f; });
  });
  lista.sort((a, b) => a.d < b.d ? -1 : 1);
  provMem[sym] = { t: Date.now(), l: lista };
  return lista;
}
// DY por ano = proventos (pela data com) ÷ preço de fechamento do ano; "atual" = últimos 12 meses ÷ preço atual
async function historicoDY(sym) {
  const [prov, h] = await Promise.all([buscarProventos(sym), buscarHistorico(sym, 'm')]);
  if (!prov.length) return { anos: [], atual: null, prov, porAno: {} };
  const fech = {};
  (h.m || []).forEach(p => { const y = new Date(p.t * 1000).getUTCFullYear(); fech[y] = p.c; });
  const porAno = {};
  prov.forEach(p => { const y = +p.d.slice(0, 4); porAno[y] = (porAno[y] || 0) + p.v; });
  const anoAtual = new Date().getFullYear();
  const anos = Object.keys(porAno).map(Number).filter(y => y < anoAtual && fech[y] > 0).sort()
    .slice(-10).map(y => ({ ano: y, dy: porAno[y] / fech[y] * 100, valor: porAno[y] }));
  const umAno = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
  const q = cotacoes[sym] || {}, preco = q.preco || h.preco;
  const ult12 = prov.filter(p => p.d > umAno).reduce((s, p) => s + p.v, 0);
  return { anos, atual: preco ? ult12 / preco * 100 : null, ult12, prov, porAno };
}
// P/L e P/VP: histórico trimestral da Bolsai (Pro) ou o registro mensal do app

/* --- cartão de indicadores na tela da ação --- */

  if (k === 'valorMercado') return v >= 1e9 ? 'R$ ' + num(v / 1e9, 1) + ' bi' : 'R$ ' + num(v / 1e6, 1) + ' mi';
  if (['lpa', 'vpa', 'dividendoCota'].includes(k)) return 'R$ ' + num(v);

    let p = sym.endsWith('.SA') ? 20 + rnd() * 30 : 100 + rnd() * 100;
    const ts = [], c = [], agora = Math.floor(Date.now() / 1000);
    for (let i = n - 1; i >= 0; i--) { p *= 1 + (rnd() - 0.48) * 0.035; ts.push(agora - i * 86400 * passoDias); c.push(+p.toFixed(2)); }
    return { ts, c };
  }
  return {
    fetch(url, id) {
      if (/usebolsai.*reference_date=(\d{4})/.test(url)) { const y = +url.match(/reference_date=(\d{4})/)[1]; return setTimeout(() => window.__cb(id, true, y < 2014 ? JSON.stringify({ reference_date: '2026-06-30' }) : JSON.stringify({ reference_date: y + '-12-31', market_cap: 1e11 * (1 + (y % 5) / 10), pl: 6 + (y % 4) })), 60); }
      if (/fundamentus|usebolsai/.test(url)) return setTimeout(() => window.__cb(id, true, simFund(url)), 150);
      if (/api\.bcb\.gov\.br/.test(url)) return setTimeout(() => { const l = []; for (let k = 800; k >= 0; k--) { const d = new Date(Date.now() - k * 864e5); if (d.getDay() % 6) l.push({ data: d.toLocaleDateString('pt-BR'), valor: '0.0548' }); } window.__cb(id, true, JSON.stringify(l)); }, 150);
      setTimeout(() => {
        const sym = decodeURIComponent(url.split('/chart/')[1].split('?')[0]);
        if (sym.startsWith('XXXX')) return window.__cb(id, false, 'HTTP 404');
        const sem = url.includes('1wk'), n = url.includes('5d') ? 5 : url.includes('period1') ? 3500 : sem ? 700 : 2500;
        const full = serie(sym, 3500, 1), preco = full.c[full.c.length - 1];
        let ts = full.ts.slice(-n), c = full.c.slice(-n);
        const passo = url.includes('1mo') ? 30 : sem ? 7 : 0;
        if (passo) { ts = []; c = []; for (let i = full.c.length - 1; i >= 0; i -= passo) { ts.unshift(full.ts[i]); c.unshift(full.c[i]); } }
        window.__cb(id, true, JSON.stringify({ chart: { result: [{ meta: { regularMarketPrice: preco, currency: sym.endsWith('.SA') ? 'BRL' : 'USD', shortName: nomes[sym] || sym },
          timestamp: ts, indicators: { quote: [(() => { const cc = url.includes('5d') ? full.c.slice(-5) : c;
            const o = cc.map((x, i) => i ? cc[i - 1] : x);
            return { close: cc, open: o, high: cc.map((x, i) => Math.max(x, o[i]) * 1.008), low: cc.map((x, i) => Math.min(x, o[i]) * 0.992), volume: cc.map((x, i) => 1e6 * (1 + ((i * 7919) % 13) / 6)) }; })()] } }] } }));
      }, 250);
    },
    load: k => mem[k] || localStorage.getItem('m_' + k) || '',
    save: (k, v) => { mem[k] = v; },
    alertas() { return mem.alertas || '[]'; },
    addAlerta(j) { const a = JSON.parse(this.alertas()), o = JSON.parse(j); o.id = String(Date.now()); o.ativo = true; a.push(o); mem.alertas = JSON.stringify(a); return mem.alertas; },
    removerAlerta(id) { mem.alertas = JSON.stringify(JSON.parse(this.alertas()).filter(a => a.id !== id)); return mem.alertas; },
    ativarAlerta(id, on) { const a = JSON.parse(this.alertas()); a.forEach(x => { if (x.id === id) { x.ativo = on; if (on) delete x.disparadoEm; } }); mem.alertas = JSON.stringify(a); return mem.alertas; },
    verificarAgora(id) { setTimeout(() => { mem.ultimaVerificacao = String(Date.now()); window.__cb(id, true, 'Nenhum alerta disparou.'); }, 300); },
    notificacoesLiberadas: () => true,
    sincronizar(id) { setTimeout(() => window.__cb(id, false, 'sem planilha no modo de teste'), 200); }
  };
}

ir('lista');
atualizarLista();
sincronizarAgora(true);
