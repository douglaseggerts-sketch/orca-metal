<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Monitor de Ações</title>
<style>
  :root {
    --bg: #08090C; --card: #111318; --card2: #191C23; --linha: #252A33;
    --txt: #E8EBF0; --sub: #8A93A3; --alta: #19C37D; --baixa: #F23645;
    --ouro: #2F7BFF; --azul: #4FC3F7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 72px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--linha); }
  header h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 650; letter-spacing: .2px; }
  .icone { background: var(--card); border: 1px solid var(--linha); color: var(--txt); border-radius: 10px;
    width: 38px; height: 38px; font-size: 18px; display: grid; place-items: center; }
  main { padding: 12px 16px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav button { flex: 1; background: none; border: 0; color: var(--sub); padding: 10px 0 12px; font-size: 12px; }
  nav button b { display: block; font-size: 20px; line-height: 1.2; font-weight: 400; }
  nav button.on { color: var(--ouro); }
  .modo { display:flex; gap:6px; } .modo button { background: var(--card2); border:1px solid var(--linha); color: var(--sub); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:600; } .modo button.on { color:#fff; border-color: var(--ouro); }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .linha { display: flex; gap: 8px; align-items: center; }
  input, select { background: var(--card2); color: var(--txt); border: 1px solid var(--linha); border-radius: 10px;
    padding: 10px 12px; font-size: 15px; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--ouro); outline-offset: -1px; }
  .btn { background: var(--ouro); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px;
    font-weight: 650; font-size: 15px; white-space: nowrap; }
  .btn.sec { background: var(--card2); color: var(--txt); border: 1px solid var(--linha); }
  .btn.peq { padding: 6px 10px; font-size: 13px; }
  .sub { color: var(--sub); font-size: 13px; }
  .alta { color: var(--alta); } .baixa { color: var(--baixa); }
  .vazio { text-align: center; color: var(--sub); padding: 30px 10px; }
  /* lista */
  .ativo { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card);
    border: 1px solid var(--linha); border-radius: 14px; margin-bottom: 8px; }
  .ativo .nome { flex: 1; min-width: 0; }
  .ativo .tk { font-weight: 700; font-size: 16px; }
  .ativo .ds { color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ativo .pr { text-align: right; font-variant-numeric: tabular-nums; }
  .ativo .pr div:first-child { font-weight: 650; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--card2); color: var(--sub);
    border: 1px solid var(--linha); margin-left: 6px; vertical-align: 2px; font-weight: 600; }
  .x { background: none; border: 0; color: var(--sub); font-size: 20px; padding: 0 2px 0 6px; }
  /* detalhe */
  .topo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .topo .grande { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .periodos { display: flex; gap: 6px; margin: 12px 0 8px; }
  .periodos button { flex: 1; background: var(--card2); border: 1px solid var(--linha); color: var(--sub);
    border-radius: 8px; padding: 7px 0; font-size: 13px; font-weight: 600; }
  .periodos button.on { color: #fff; background: var(--ouro); border-color: var(--ouro); }
  .grafico { position: relative; height: 330px; margin: 0 -6px; touch-action: pan-y; }
  .grafico canvas { width: 100%; height: 100%; display: block; }
  .info { min-height: 20px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; margin: 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha); border-radius: 20px;
    padding: 4px 10px; font-size: 13px; background: var(--card2); color: var(--sub); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chip.on { color: var(--txt); border-color: #4A5361; }
  .chip.off i { opacity: .25; }
  .sinal { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--card2); margin-top: 10px; }
  h2 { font-size: 15px; margin: 4px 0 10px; font-weight: 650; }
  .form { display: grid; gap: 8px; }
  .al { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--linha); }
  .al:first-of-type { border-top: 0; }
  .al .t { flex: 1; min-width: 0; font-size: 14px; }
  .bola { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .sw { position: relative; width: 42px; height: 24px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; background: var(--card2); border: 1px solid var(--linha); border-radius: 20px; transition: .15s; }
  .sw span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: var(--sub); transition: .15s; }
  .sw input:checked + span { background: #12284D; border-color: var(--ouro); }
  .sw input:checked + span::after { left: 20px; background: #fff; }
  .aviso { background: #2A1418; border: 1px solid #5A2530; color: #F5B8C0; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 84px; background: #2A313C; color: var(--txt);
    padding: 12px 14px; border-radius: 12px; font-size: 14px; z-index: 9; opacity: 0; transform: translateY(10px);
    transition: .2s; pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }
  .carregando { color: var(--sub); text-align: center; padding: 40px 0; }
  @media (min-width: 760px) {
    main, header { max-width: 980px; margin: 0 auto; }
    header { border-bottom: 0; }
    .grafico { height: 480px; }
    nav { justify-content: center; } nav button { flex: 0 0 160px; }
  }
  input[type=color] { padding: 2px; height: 42px; width: 52px; flex: none; }
</style>
</head>
<body>
<header>
  <button class="icone" id="btVoltar" style="display:none" onclick="voltar()">‹</button>
  <h1 id="titulo">Ações</h1>
  <button class="icone" id="btAtualizar" onclick="atualizar()">↻</button>
</header>
<main id="tela"></main>
<nav>
  <button data-v="lista" onclick="ir('lista')"><b>📈</b>Ações</button>
  <button data-v="alertas" onclick="ir('alertas')"><b>🔔</b>Alertas</button>
  <button data-v="medias" onclick="ir('medias')"><b>〰️</b>Médias</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ===================== Ponte com o Android (ou simulação no navegador) ===================== */
const B = window.Android || simulacao();
const PC = !!(B.plataforma && B.plataforma() === 'pc');
const cbs = {}; let cbN = 0;
window.__cb = (id, ok, txt) => { const f = cbs[id]; delete cbs[id]; if (f) f(ok, txt); };
function chamar(fn, ...args) {
  return new Promise((res, rej) => {
    const id = 'c' + (++cbN);
    cbs[id] = (ok, t) => ok ? res(t) : rej(new Error(t));
    const r = B[fn](...args, id);
    // versão PC devolve uma Promise em vez de responder por window.__cb
    if (r && typeof r.then === 'function') r.then(t => window.__cb(id, true, t), e => window.__cb(id, false, String((e && e.message) || e)));
  });
}
function ler(chave, padrao) {
  try { const v = B.load(chave); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; }
}
function gravar(chave, v) { B.save(chave, JSON.stringify(v)); }
function alertas() { try { return JSON.parse(B.alertas()); } catch (e) { return []; } }

/* ===================== Estado ===================== */
const CORES = ['#F5B942', '#4FC3F7', '#EF6C9C', '#B388FF', '#81C784', '#FF8A65'];
let lista = ler('lista', ['PETR4.SA', 'VALE3.SA', 'ITUB4.SA', 'AAPL', 'NVDA']);
let medias = ler('medias', [
  { p: 9, t: 'EMA', c: '#F5B942', on: true },
  { p: 21, t: 'SMA', c: '#4FC3F7', on: true },
  { p: 200, t: 'SMA', c: '#EF6C9C', on: false }
]);
const cotacoes = {};   // sym -> {preco, var, nome, moeda}
const historico = {};  // sym -> {d: pts, w: pts, nome, moeda, preco}
let view = 'lista', atual = null, periodo = ler('periodo', '6M'), modo = ler('modo', 'candle');
const PERIODOS = { '1M': [22, 'd'], '3M': [66, 'd'], '6M': [126, 'd'], '1A': [252, 'd'], '5A': [260, 'w'] };

/* ===================== Utilidades ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rot = s => s.replace(/\.SA$/, '');
const mercado = s => s.endsWith('.SA') ? 'B3' : 'EUA';
function normalizar(s) {
  s = s.trim().toUpperCase().replace(/\s+/g, '');
  if (!s) return '';
  if (/^[A-Z]{4}\d{1,2}F?$/.test(s)) s = s.replace(/F$/, '') + '.SA';
  return s;
}
function dinheiro(v, moeda) {
  if (v == null || isNaN(v)) return '—';
  try { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: moeda || 'BRL' }).format(v); }
  catch (e) { return v.toFixed(2); }
}
const num = (v, d = 2) => (v == null || isNaN(v)) ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => (v > 0 ? '+' : '') + num(v) + '%';
const dataBR = t => new Date(t * 1000).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
const nomeMM = m => (m.p <= 1 ? 'Preço' : (m.t === 'EMA' ? 'MME' : 'MM') + m.p);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }

/* ===================== Médias móveis ===================== */
function sma(v, p) {
  const o = new Array(v.length).fill(null); if (p <= 1) return v.slice();
  let s = 0;
  for (let i = 0; i < v.length; i++) { s += v[i]; if (i >= p) s -= v[i - p]; if (i >= p - 1) o[i] = s / p; }
  return o;
}
function ema(v, p) {
  const o = new Array(v.length).fill(null); if (p <= 1) return v.slice();
  if (v.length < p) return o;
  const k = 2 / (p + 1); let e = 0;
  for (let i = 0; i < p; i++) e += v[i];
  e /= p; o[p - 1] = e;
  for (let i = p; i < v.length; i++) { e = v[i] * k + e * (1 - k); o[i] = e; }
  return o;
}
const mm = (v, p, t) => t === 'EMA' ? ema(v, p) : sma(v, p);

/* ===================== Dados (Yahoo Finance) ===================== */
const URL_Y = 'https://query1.finance.yahoo.com/v8/finance/chart/';
function interpretar(txt) {
  const j = JSON.parse(txt);
  if (j.chart && j.chart.error) throw new Error(j.chart.error.description || 'erro');
  const r = j.chart.result && j.chart.result[0];
  if (!r) throw new Error('Ação não encontrada');
  const ts = r.timestamp || [], q = r.indicators.quote[0] || {}, c = q.close || [];
  const o = q.open || [], hi = q.high || [], lo = q.low || [], vol = q.volume || [];
  const pts = [];
  for (let i = 0; i < ts.length; i++) if (c[i] != null) {
    const ab = o[i] != null ? o[i] : c[i];
    pts.push({ t: ts[i], c: c[i], o: ab, h: hi[i] != null ? hi[i] : Math.max(ab, c[i]), l: lo[i] != null ? lo[i] : Math.min(ab, c[i]), v: vol[i] || 0 });
  }
  const m = r.meta;
  return { pts, preco: m.regularMarketPrice, moeda: m.currency || 'BRL', nome: m.shortName || m.longName || '' };
}
async function buscarCotacao(sym) {
  const d = interpretar(await chamar('fetch', URL_Y + encodeURIComponent(sym) + '?range=5d&interval=1d'));
  const p = d.pts;
  let anterior = p.length >= 2 ? p[p.length - 2].c : null;
  // se o último ponto não for de hoje, a variação é contra o último fechamento
  if (p.length && Math.abs(p[p.length - 1].c - d.preco) > 1e-9 && (Date.now() / 1000 - p[p.length - 1].t) > 86400) anterior = p[p.length - 1].c;
  const q = { preco: d.preco, moeda: d.moeda, nome: d.nome, var: anterior ? (d.preco / anterior - 1) * 100 : null };
  cotacoes[sym] = q;
  return q;
}
async function buscarHistorico(sym, f) {
  historico[sym] = historico[sym] || {};
  if (historico[sym][f]) return historico[sym];
  const url = URL_Y + encodeURIComponent(sym) + (f === 'd' ? '?range=5y&interval=1d' : '?range=10y&interval=1wk');
  const d = interpretar(await chamar('fetch', url));
  if (d.pts.length && d.preco != null) { const u = d.pts[d.pts.length - 1]; u.c = d.preco; u.h = Math.max(u.h, d.preco); u.l = Math.min(u.l, d.preco); }
  Object.assign(historico[sym], { [f]: d.pts, nome: d.nome, moeda: d.moeda, preco: d.preco });
  return historico[sym];
}

/* ===================== Navegação ===================== */
function ir(v, sym) {
  view = v;
  if (v === 'detalhe') atual = sym;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === (v === 'detalhe' ? 'lista' : v)));
  $('btVoltar').style.display = v === 'detalhe' ? '' : 'none';
  $('btAtualizar').style.display = (v === 'lista' || v === 'detalhe' || v === 'alertas') ? '' : 'none';
  window.scrollTo(0, 0);
  render();
}
window.voltar = function () { if (view === 'detalhe') { ir('lista'); return true; } if (view !== 'lista') { ir('lista'); return true; } return false; };
window.aoVoltarAoApp = function () { if (view === 'alertas') render(); else if (view === 'lista') atualizarLista(); };
function render() {
  if (view === 'lista') telaLista();
  else if (view === 'detalhe') telaDetalhe();
  else if (view === 'alertas') telaAlertas();
  else if (view === 'medias') telaMedias();
}
function atualizar() {
  if (view === 'detalhe') { delete historico[atual]; telaDetalhe(); }
  else if (view === 'alertas') verificarAgora();
  else atualizarLista();
}

/* ===================== Tela: lista ===================== */
function telaLista() {
  $('titulo').textContent = 'Ações';
  let h = `<div class="card"><div class="linha">
      <input id="novo" placeholder="Código: PETR4, VALE3, AAPL…" autocapitalize="characters" autocomplete="off"
        onkeydown="if(event.key==='Enter')adicionar()">
      <button class="btn" onclick="adicionar()">Adicionar</button></div>
      <div class="sub" style="margin-top:8px">Ações da B3 pelo código (PETR4). Americanas pelo ticker (AAPL). ETFs e FIIs também funcionam (BOVA11, HGLG11).</div></div>`;
  if (!lista.length) h += `<div class="vazio">Nenhuma ação na lista.</div>`;
  h += lista.map(s => {
    const q = cotacoes[s];
    const cl = q && q.var != null ? (q.var >= 0 ? 'alta' : 'baixa') : 'sub';
    return `<div class="ativo" onclick="ir('detalhe','${esc(s)}')">
      <div class="nome"><div class="tk">${esc(rot(s))}<span class="tag">${mercado(s)}</span></div>
        <div class="ds">${q ? esc(q.nome) : 'carregando…'}</div></div>
      <div class="pr"><div>${q ? dinheiro(q.preco, q.moeda) : '—'}</div>
        <div class="${cl}" style="font-size:13px">${q && q.var != null ? pct(q.var) : (q && q.erro ? 'sem dados' : '')}</div></div>
      <button class="x" onclick="event.stopPropagation();remover('${esc(s)}')" aria-label="Remover">×</button></div>`;
  }).join('');
  const ult = ler('ultimaVerificacao', null);
  if (ult) h += `<div class="sub" style="text-align:center;margin-top:10px">Última verificação de alertas: ${new Date(+ult).toLocaleString('pt-BR')}</div>`;
  $('tela').innerHTML = h;
}
async function atualizarLista() {
  if (view === 'lista') telaLista();
  await Promise.all(lista.map(s => buscarCotacao(s).catch(() => { cotacoes[s] = Object.assign(cotacoes[s] || {}, { erro: true }); })));
  if (view === 'lista') telaLista();
}
async function adicionar() {
  const s = normalizar($('novo').value);
  if (!s) return;
  if (lista.includes(s)) { toast(rot(s) + ' já está na lista'); return; }
  $('novo').disabled = true;
  try {
    await buscarCotacao(s);
    lista.push(s); gravar('lista', lista);
    toast(rot(s) + ' adicionada');
  } catch (e) {
    toast('Não encontrei "' + rot(s) + '". Confira o código.');
  }
  telaLista();
}
function remover(s) {
  if (!confirm('Remover ' + rot(s) + ' da lista?')) return;
  lista = lista.filter(x => x !== s); gravar('lista', lista); telaLista();
}

/* ===================== Tela: detalhe ===================== */
async function telaDetalhe() {
  const s = atual;
  $('titulo').textContent = rot(s);
  const q = cotacoes[s];
  $('tela').innerHTML = `
    <div class="topo"><span class="grande" id="dPreco">${q ? dinheiro(q.preco, q.moeda) : '—'}</span>
      <span id="dVar" class="${q && q.var >= 0 ? 'alta' : 'baixa'}">${q && q.var != null ? pct(q.var) + ' hoje' : ''}</span></div>
    <div class="sub" id="dNome">${q ? esc(q.nome) : ''} · ${mercado(s)}</div>
    <div class="periodos">${Object.keys(PERIODOS).map(p => `<button class="${p === periodo ? 'on' : ''}" onclick="mudarPeriodo('${p}')">${p}</button>`).join('')}</div>
    <div class="linha" style="justify-content:space-between;align-items:flex-start"><div class="info" id="info" style="flex:1">${PC ? 'Passe o mouse no gráfico.' : 'Toque e arraste no gráfico.'}</div>
      <div class="modo"><button id="mC" class="${modo === 'candle' ? 'on' : ''}" onclick="mudarModo('candle')">Candle</button><button id="mL" class="${modo === 'linha' ? 'on' : ''}" onclick="mudarModo('linha')">Linha</button></div></div>
    <div class="grafico" id="graf"><div class="carregando">Carregando…</div></div>
    <div class="chips" id="chips"></div>
    <div id="sinal"></div>
    <div class="card" style="margin-top:14px">
      <h2>Alertas de ${esc(rot(s))}</h2>
      <div id="alLista"></div>
      <div class="form" style="margin-top:10px">
        <select id="aTipo" onchange="ajustarForm()">
          <option value="abaixo">🟢 Comprar quando o preço cair até…</option>
          <option value="acima">🔴 Vender quando o preço subir até…</option>
          <option value="cruza_cima">🟢 Compra: média curta cruzar p/ cima da longa</option>
          <option value="cruza_baixo">🔴 Venda: média curta cruzar p/ baixo da longa</option>
        </select>
        <div id="fPreco"><input id="aValor" type="number" inputmode="decimal" step="0.01" placeholder="Preço alvo"></div>
        <div id="fMM" style="display:none" class="form">
          <div class="linha">
            <input id="aCurta" type="number" inputmode="numeric" min="1" value="9" placeholder="Curta">
            <input id="aLonga" type="number" inputmode="numeric" min="2" value="21" placeholder="Longa">
            <select id="aTipoMM"><option value="SMA">MM simples</option><option value="EMA">MM exponencial</option></select>
          </div>
          <div class="sub">Períodos em dias. Use 1 na curta para “preço cruzar a média”.</div>
        </div>
        <input id="aNota" placeholder="Anotação (opcional)">
        <button class="btn" onclick="criarAlerta()">Criar alerta</button>
      </div>
    </div>`;
  listarAlertasAtivo();
  buscarCotacao(s).then(q => {
    if (view !== 'detalhe' || atual !== s) return;
    $('dPreco').textContent = dinheiro(q.preco, q.moeda);
    $('dVar').textContent = q.var != null ? pct(q.var) + ' hoje' : '';
    $('dVar').className = q.var >= 0 ? 'alta' : 'baixa';
    $('dNome').textContent = q.nome + ' · ' + mercado(s);
    const v = $('aValor'); if (v && !v.value) v.placeholder = 'Preço alvo (atual ' + num(q.preco) + ')';
  }).catch(() => { });
  desenharDetalhe();
}
function mudarPeriodo(p) {
  periodo = p; gravar('periodo', p);
  document.querySelectorAll('.periodos button').forEach(b => b.classList.toggle('on', b.textContent === p));
  desenharDetalhe();
}
async function desenharDetalhe() {
  const s = atual, [n, f] = PERIODOS[periodo];
  let h;
  try { h = await buscarHistorico(s, f); }
  catch (e) { if (view === 'detalhe') $('graf').innerHTML = `<div class="carregando">Não consegui carregar o histórico.<br><span class="sub">${esc(e.message).slice(0, 120)}</span></div>`; return; }
  if (view !== 'detalhe' || atual !== s) return;
  const pts = h[f], v = pts.map(p => p.c);
  const series = medias.map(m => ({ m, val: mm(v, m.p, m.t) }));
  const ini = Math.max(0, pts.length - n);
  grafico.dados = { pts: pts.slice(ini), series: series.filter(x => x.m.on).map(x => ({ m: x.m, val: x.val.slice(ini) })), moeda: h.moeda, f };
  grafico.toque = null;
  if (!$('graf').querySelector('canvas')) { $('graf').innerHTML = '<canvas id="cv"></canvas>'; ligarToque(); }
  grafico.desenhar();
  // chips
  $('chips').innerHTML = medias.map((m, i) => `<span class="chip ${m.on ? 'on' : 'off'}" onclick="alternarMM(${i})"><i style="background:${m.c}"></i>${nomeMM(m)}${f === 'w' ? ' sem' : ''}</span>`).join('');
  // sinal (sempre no diário)
  let txt = '';
  const ativas = series.filter(x => x.m.on && x.m.p > 1).sort((a, b) => a.m.p - b.m.p);
  const ultimo = v[v.length - 1];
  if (ativas.length) {
    const partes = ativas.map(x => {
      const val = x.val[x.val.length - 1];
      if (val == null) return `${nomeMM(x.m)}: histórico insuficiente`;
      return `Preço ${ultimo >= val ? '<b class="alta">acima</b>' : '<b class="baixa">abaixo</b>'} da ${nomeMM(x.m)} (${num(val)})`;
    });
    if (ativas.length >= 2) {
      const a = ativas[0], b = ativas[ativas.length - 1];
      const va = a.val[a.val.length - 1], vb = b.val[b.val.length - 1];
      if (va != null && vb != null) partes.push(`${nomeMM(a.m)} ${va > vb ? '<b class="alta">acima</b>' : '<b class="baixa">abaixo</b>'} da ${nomeMM(b.m)} → tendência de ${va > vb ? 'alta' : 'baixa'}`);
    }
    txt = `<div class="sinal">${partes.join('<br>')}</div>`;
  }
  $('sinal').innerHTML = txt;
}
function mudarModo(m) { modo = m; gravar('modo', m); $('mC').classList.toggle('on', m === 'candle'); $('mL').classList.toggle('on', m === 'linha'); grafico.desenhar(); }
function alternarMM(i) { medias[i].on = !medias[i].on; gravar('medias', medias); desenharDetalhe(); }

/* --- gráfico em canvas --- */
const grafico = {
  dados: null, toque: null,
  desenhar() {
    const cv = $('cv'); if (!cv || !this.dados) return;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const { pts, series, f } = this.dados;
    if (pts.length < 2) return;
    const padL = 6, padR = 58, padT = 10, padB = 22;
    let lo = Infinity, hi = -Infinity;
    pts.forEach(p => { lo = Math.min(lo, modo === 'candle' ? p.l : p.c); hi = Math.max(hi, modo === 'candle' ? p.h : p.c); });
    series.forEach(s => s.val.forEach(x => { if (x != null) { lo = Math.min(lo, x); hi = Math.max(hi, x); } }));
    const linhasAl = alertas().filter(a => a.sym === atual && a.ativo && (a.tipo === 'abaixo' || a.tipo === 'acima'));
    linhasAl.forEach(a => { lo = Math.min(lo, a.valor); hi = Math.max(hi, a.valor); });
    const marg = (hi - lo) * 0.06 || hi * 0.01 || 1; lo -= marg; hi += marg;
    const X = i => padL + (W - padL - padR) * i / (pts.length - 1);
    const areaP = (H - padT - padB) * 0.84;
    const Y = v => padT + areaP * (1 - (v - lo) / (hi - lo));
    this.X = X; this.padL = padL; this.padR = padR; this.W = W;
    // grade
    g.font = '11px system-ui, sans-serif'; g.textBaseline = 'middle';
    const passo = niceStep((hi - lo) / 5);
    for (let y = Math.ceil(lo / passo) * passo; y <= hi; y += passo) {
      g.strokeStyle = '#222933'; g.lineWidth = 1; g.beginPath(); g.moveTo(padL, Y(y)); g.lineTo(W - padR, Y(y)); g.stroke();
      g.fillStyle = '#6E7887'; g.fillText(num(y, passo < 1 ? 2 : 0), W - padR + 6, Y(y));
    }
    // datas
    g.textBaseline = 'alphabetic'; g.textAlign = 'center';
    const nd = 4;
    for (let k = 0; k < nd; k++) {
      const i = Math.round((pts.length - 1) * (k + 0.5) / nd);
      const d = new Date(pts[i].t * 1000);
      g.fillStyle = '#6E7887';
      g.fillText(d.toLocaleDateString('pt-BR', f === 'w' ? { month: 'short', year: '2-digit' } : { day: '2-digit', month: 'short' }), X(i), H - 6);
    }
    g.textAlign = 'left';
    // linhas de alerta
    linhasAl.forEach(a => {
      const cor = a.tipo === 'abaixo' ? '#2FD39A' : '#FF5C6C';
      g.setLineDash([5, 4]); g.strokeStyle = cor; g.lineWidth = 1;
      g.beginPath(); g.moveTo(padL, Y(a.valor)); g.lineTo(W - padR, Y(a.valor)); g.stroke(); g.setLineDash([]);
      g.fillStyle = cor; g.fillRect(W - padR + 2, Y(a.valor) - 8, padR - 2, 16);
      g.fillStyle = '#08090C'; g.textBaseline = 'middle'; g.fillText(num(a.valor), W - padR + 6, Y(a.valor));
    });
    // volume (faixa de baixo)
    const vH = (H - padT - padB) * 0.16, vMax = Math.max(...pts.map(p => p.v || 0)) || 1;
    const larg = Math.max(1, (W - padL - padR) / pts.length * 0.7);
    pts.forEach((p, i) => {
      if (!p.v) return;
      const h = vH * p.v / vMax;
      g.fillStyle = p.c >= p.o ? 'rgba(25,195,125,.28)' : 'rgba(242,54,69,.28)';
      g.fillRect(X(i) - larg / 2, H - padB - h, larg, h);
    });
    const sobe = pts[pts.length - 1].c >= (pts.length > 1 ? pts[pts.length - 2].c : pts[0].c), corP = sobe ? '#19C37D' : '#F23645';
    if (modo === 'candle') {
      pts.forEach((p, i) => {
        const cor = p.c >= p.o ? '#19C37D' : '#F23645';
        g.strokeStyle = cor; g.fillStyle = cor; g.lineWidth = 1;
        g.beginPath(); g.moveTo(X(i), Y(p.h)); g.lineTo(X(i), Y(p.l)); g.stroke();
        const y1 = Y(Math.max(p.o, p.c)), y2 = Y(Math.min(p.o, p.c));
        g.fillRect(X(i) - larg / 2, y1, larg, Math.max(1, y2 - y1));
      });
    } else {
      const grad = g.createLinearGradient(0, padT, 0, H - padB);
      grad.addColorStop(0, 'rgba(47,123,255,.25)'); grad.addColorStop(1, 'rgba(47,123,255,0)');
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(i), Y(p.c)) : g.moveTo(X(i), Y(p.c)));
      g.lineTo(X(pts.length - 1), H - padB); g.lineTo(X(0), H - padB); g.closePath(); g.fillStyle = grad; g.fill();
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(i), Y(p.c)) : g.moveTo(X(i), Y(p.c)));
      g.strokeStyle = '#2F7BFF'; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
    }
    // médias
    series.forEach(s => {
      g.beginPath(); let on = false;
      s.val.forEach((x, i) => { if (x == null) { on = false; return; } on ? g.lineTo(X(i), Y(x)) : g.moveTo(X(i), Y(x)); on = true; });
      g.strokeStyle = s.m.c; g.lineWidth = 1.5; g.stroke();
    });
    // último preço
    const ult = pts[pts.length - 1].c;
    g.fillStyle = corP; g.fillRect(W - padR + 2, Y(ult) - 9, padR - 2, 18);
    g.fillStyle = '#08090C'; g.font = 'bold 11px system-ui, sans-serif'; g.textBaseline = 'middle'; g.fillText(num(ult), W - padR + 6, Y(ult));
    // toque
    if (this.toque != null) {
      const i = this.toque, p = pts[i];
      g.strokeStyle = '#8B95A5'; g.lineWidth = 1; g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(X(i), padT); g.lineTo(X(i), H - padB); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#E6EAF0'; g.beginPath(); g.arc(X(i), Y(p.c), 4, 0, 7); g.fill();
      $('info').innerHTML = `<b style="color:var(--txt)">${dataBR(p.t)}</b> A ${num(p.o)} M ${num(p.h)} m ${num(p.l)} F <b style="color:${p.c >= p.o ? 'var(--alta)' : 'var(--baixa)'}">${num(p.c)}</b><br>` +
        series.map(s => s.val[i] != null ? ` <span style="color:${s.m.c}">${nomeMM(s.m)} ${num(s.val[i])}</span>` : '').join('');
    }
  }
};
function niceStep(x) { const e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * e; }
function ligarToque() {
  const el = $('graf');
  const mover = ev => {
    if (!grafico.dados) return;
    const r = el.getBoundingClientRect(), t = ev.touches ? ev.touches[0] : ev;
    const n = grafico.dados.pts.length;
    const fr = (t.clientX - r.left - grafico.padL) / (grafico.W - grafico.padL - grafico.padR);
    grafico.toque = Math.max(0, Math.min(n - 1, Math.round(fr * (n - 1))));
    grafico.desenhar();
  };
  el.addEventListener('touchstart', mover, { passive: true });
  el.addEventListener('touchmove', mover, { passive: true });
  el.addEventListener('mousemove', mover);
}
window.addEventListener('resize', () => view === 'detalhe' && grafico.desenhar());

/* --- alertas do ativo --- */
function ajustarForm() {
  const t = $('aTipo').value, mmT = t.startsWith('cruza');
  $('fPreco').style.display = mmT ? 'none' : '';
  $('fMM').style.display = mmT ? '' : 'none';
}
function descreverAlerta(a, moeda) {
  if (a.tipo === 'abaixo') return `Comprar se preço ≤ <b>${dinheiro(a.valor, moeda)}</b>`;
  if (a.tipo === 'acima') return `Vender se preço ≥ <b>${dinheiro(a.valor, moeda)}</b>`;
  const c = nomeMM({ p: a.mmCurta, t: a.tipoMM }), l = nomeMM({ p: a.mmLonga, t: a.tipoMM });
  return a.tipo === 'cruza_cima' ? `Compra: <b>${c}</b> cruzar p/ cima da <b>${l}</b>` : `Venda: <b>${c}</b> cruzar p/ baixo da <b>${l}</b>`;
}
function linhaAlerta(a, comAtivo) {
  const moeda = (cotacoes[a.sym] || {}).moeda || (a.sym.endsWith('.SA') ? 'BRL' : 'USD');
  const compra = a.tipo === 'abaixo' || a.tipo === 'cruza_cima';
  const st = a.disparadoEm
    ? `<div class="sub">⚡ Disparou em ${new Date(a.disparadoEm).toLocaleString('pt-BR')} a ${dinheiro(a.precoDisparo, moeda)}</div>`
    : (a.ativo ? '' : '<div class="sub">Pausado</div>');
  return `<div class="al"><span class="bola" style="background:${compra ? 'var(--alta)' : 'var(--baixa)'}"></span>
    <div class="t">${comAtivo ? `<b>${esc(rot(a.sym))}</b> · ` : ''}${descreverAlerta(a, moeda)}${a.nota ? `<div class="sub">${esc(a.nota)}</div>` : ''}${st}</div>
    <label class="sw"><input type="checkbox" ${a.ativo ? 'checked' : ''} onchange="ativar('${a.id}', this.checked)"><span></span></label>
    <button class="x" onclick="apagar('${a.id}')" aria-label="Excluir">×</button></div>`;
}
function listarAlertasAtivo() {
  const l = alertas().filter(a => a.sym === atual);
  $('alLista').innerHTML = l.length ? l.map(a => linhaAlerta(a, false)).join('') : '<div class="sub">Nenhum alerta para esta ação.</div>';
}
function criarAlerta() {
  const t = $('aTipo').value, a = { sym: atual, tipo: t, nota: $('aNota').value.trim() };
  if (t.startsWith('cruza')) {
    a.mmCurta = parseInt($('aCurta').value, 10); a.mmLonga = parseInt($('aLonga').value, 10); a.tipoMM = $('aTipoMM').value;
    if (!(a.mmCurta >= 1) || !(a.mmLonga >= 2) || a.mmCurta >= a.mmLonga) { toast('A média curta deve ser menor que a longa.'); return; }
  } else {
    a.valor = parseFloat(String($('aValor').value).replace(',', '.'));
    if (!(a.valor > 0)) { toast('Informe o preço alvo.'); return; }
    const q = cotacoes[atual];
    if (q && ((t === 'abaixo' && q.preco <= a.valor) || (t === 'acima' && q.preco >= a.valor)))
      if (!confirm('O preço atual (' + num(q.preco) + ') já atende essa condição — o alerta vai disparar na próxima verificação. Criar mesmo assim?')) return;
  }
  B.addAlerta(JSON.stringify(a));
  $('aValor').value = ''; $('aNota').value = '';
  toast('Alerta criado');
  listarAlertasAtivo(); grafico.desenhar();
  if (!B.notificacoesLiberadas()) toast('Atenção: as notificações do app estão desligadas nas configurações do Android.');
}
function ativar(id, on) { B.ativarAlerta(id, on); render(); }
function apagar(id) { if (!confirm('Excluir este alerta?')) return; B.removerAlerta(id); render(); }

/* ===================== Tela: alertas ===================== */
function telaAlertas() {
  $('titulo').textContent = 'Alertas';
  const l = alertas();
  const ult = ler('ultimaVerificacao', null);
  let h = '';
  if (!B.notificacoesLiberadas()) h += `<div class="aviso">As notificações estão desligadas. ${PC ? 'Ative as notificações do Windows para o Monitor de Ações.' : 'Ative em Configurações › Apps › Monitor de Ações › Notificações'}, senão os alertas não aparecem.</div>`;
  h += `<div class="card"><div class="linha"><div style="flex:1" class="sub">${PC ? 'O programa confere os alertas a cada 5 min enquanto estiver aberto ou minimizado perto do relógio.' : 'O celular confere os alertas a cada ~15 min, mesmo com o app fechado.'}${ult ? '<br>Última: ' + new Date(+ult).toLocaleString('pt-BR') : ''}</div>
    <button class="btn sec peq" onclick="verificarAgora()">Verificar agora</button></div></div>`;
  const ativos = l.filter(a => a.ativo && !a.disparadoEm), outros = l.filter(a => !(a.ativo && !a.disparadoEm));
  h += `<div class="card"><h2>Ativos (${ativos.length})</h2>${ativos.length ? ativos.map(a => linhaAlerta(a, true)).join('') : '<div class="sub">Crie alertas na tela de cada ação.</div>'}</div>`;
  if (outros.length) h += `<div class="card"><h2>Disparados / pausados</h2>${outros.map(a => linhaAlerta(a, true)).join('')}<div class="sub" style="margin-top:8px">Ligue a chave para reativar um alerta.</div></div>`;
  $('tela').innerHTML = h;
}
async function verificarAgora() {
  toast('Verificando…');
  try { toast(await chamar('verificarAgora')); } catch (e) { toast('Erro: ' + e.message); }
  render();
}

/* ===================== Tela: médias ===================== */
function telaMedias() {
  $('titulo').textContent = 'Médias móveis';
  let h = `<div class="card"><h2>Suas médias</h2>` + (medias.length ? medias.map((m, i) => `
    <div class="al"><span class="bola" style="background:${m.c}"></span>
      <div class="t"><b>${nomeMM(m)}</b> <span class="sub">· ${m.p} períodos · ${m.t === 'EMA' ? 'exponencial' : 'simples'}</span></div>
      <label class="sw"><input type="checkbox" ${m.on ? 'checked' : ''} onchange="medias[${i}].on=this.checked;gravar('medias',medias)"><span></span></label>
      <button class="x" onclick="medias.splice(${i},1);gravar('medias',medias);telaMedias()">×</button></div>`).join('') : '<div class="sub">Nenhuma média.</div>') + `</div>
    <div class="card"><h2>Adicionar média</h2><div class="form">
      <div class="linha">
        <input id="mP" type="number" inputmode="numeric" min="2" placeholder="Períodos (ex.: 50)">
        <select id="mT"><option value="SMA">Simples (MM)</option><option value="EMA">Exponencial (MME)</option></select>
        <input id="mC" type="color" value="${CORES[medias.length % CORES.length]}">
      </div>
      <button class="btn" onclick="addMedia()">Adicionar</button>
      <div class="sub">Comuns: MME 9 e MM 21 (curto prazo), MM 50 (médio), MM 200 (longo). No período 5A o gráfico é semanal, então os períodos contam em semanas.</div>
    </div></div>`;
  $('tela').innerHTML = h;
}
function addMedia() {
  const p = parseInt($('mP').value, 10);
  if (!(p >= 2 && p <= 500)) { toast('Use de 2 a 500 períodos.'); return; }
  medias.push({ p, t: $('mT').value, c: $('mC').value, on: true });
  medias.sort((a, b) => a.p - b.p);
  gravar('medias', medias); telaMedias(); toast(nomeMM({ p, t: $('mT').value }) + ' adicionada');
}

/* ===================== Simulação (só para testar fora do celular) ===================== */
function simulacao() {
  const mem = {};
  const nomes = { 'PETR4.SA': 'PETROBRAS PN', 'VALE3.SA': 'VALE ON', 'ITUB4.SA': 'ITAUUNIBANCO PN', AAPL: 'Apple Inc.', NVDA: 'NVIDIA Corporation' };
  function serie(sym, n, passoDias) {
    let seed = [...sym].reduce((a, c) => a + c.charCodeAt(0), 0);
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    let p = sym.endsWith('.SA') ? 20 + rnd() * 30 : 100 + rnd() * 100;
    const ts = [], c = [], agora = Math.floor(Date.now() / 1000);
    for (let i = n - 1; i >= 0; i--) { p *= 1 + (rnd() - 0.48) * 0.035; ts.push(agora - i * 86400 * passoDias); c.push(+p.toFixed(2)); }
    return { ts, c };
  }
  return {
    fetch(url, id) {
      setTimeout(() => {
        const sym = decodeURIComponent(url.split('/chart/')[1].split('?')[0]);
        if (sym.startsWith('XXXX')) return window.__cb(id, false, 'HTTP 404');
        const sem = url.includes('1wk'), n = url.includes('5d') ? 5 : sem ? 520 : 1250;
        const { ts, c } = serie(sym, n, sem ? 7 : 1);
        const full = serie(sym, 1250, 1);
        const preco = full.c[full.c.length - 1];
        window.__cb(id, true, JSON.stringify({ chart: { result: [{ meta: { regularMarketPrice: preco, currency: sym.endsWith('.SA') ? 'BRL' : 'USD', shortName: nomes[sym] || sym },
          timestamp: ts, indicators: { quote: [(() => { const cc = url.includes('5d') ? full.c.slice(-5) : c;
            const o = cc.map((x, i) => i ? cc[i - 1] : x);
            return { close: cc, open: o, high: cc.map((x, i) => Math.max(x, o[i]) * 1.008), low: cc.map((x, i) => Math.min(x, o[i]) * 0.992), volume: cc.map((x, i) => 1e6 * (1 + ((i * 7919) % 13) / 6)) }; })()] } }] } }));
      }, 250);
    },
    load: k => mem[k] || localStorage.getItem('m_' + k) || '',
    save: (k, v) => { mem[k] = v; },
    alertas() { return mem.alertas || '[]'; },
    addAlerta(j) { const a = JSON.parse(this.alertas()), o = JSON.parse(j); o.id = String(Date.now()); o.ativo = true; a.push(o); mem.alertas = JSON.stringify(a); return mem.alertas; },
    removerAlerta(id) { mem.alertas = JSON.stringify(JSON.parse(this.alertas()).filter(a => a.id !== id)); return mem.alertas; },
    ativarAlerta(id, on) { const a = JSON.parse(this.alertas()); a.forEach(x => { if (x.id === id) { x.ativo = on; if (on) delete x.disparadoEm; } }); mem.alertas = JSON.stringify(a); return mem.alertas; },
    verificarAgora(id) { setTimeout(() => { mem.ultimaVerificacao = String(Date.now()); window.__cb(id, true, 'Nenhum alerta disparou.'); }, 300); },
    notificacoesLiberadas: () => true
  };
}

ir('lista');
atualizarLista();
